    else if(a==='mascwink'){ mascWink(); }
    else if(a==='shufflequote'){ shuffleQuote(); }
  });

  function handleAnswer(btn){
    if(btn.parentNode.getAttribute('data-locked')) return;
    var opts = session.querySelector('#opts');
    opts.setAttribute('data-locked','1');
    var chosen=+btn.getAttribute('data-i'), correct=+btn.getAttribute('data-a');
    var all = opts.querySelectorAll('.opt');
    all[correct].classList.add('correct');
    if(chosen!==correct) btn.classList.add('wrong');
    var why=session.querySelector('#why'); if(why) why.classList.add('show');
    var nb=session.querySelector('#checknext');
    if(nb){ nb.disabled=false; nb.style.opacity='1'; nb.classList.remove('ghost');
      nb.innerHTML='Volgende '+IC.arrow; }
  }

  /* ---- daily missions ---- */
  function toggleMission(id){
    if(!(id in missionDone)) return;
    var todayIds = todayMissionIds();
    var before = todayIds.every(function(id){return missionDone[id];});
    missionDone[id] = !missionDone[id];
    missionsSave();
    var nowOn = missionDone[id];
    var after = todayIds.every(function(id){return missionDone[id];});
    var allDone = after && !before;
    buzz(nowOn?12:6);
    sfx(allDone ? 'complete' : (nowOn ? 'check' : 'uncheck'));
    var sc = stage.querySelector('.surface'); var top = sc?sc.scrollTop:0;
    showScreen('today');
    var ns = stage.querySelector('.surface'); if(ns) ns.scrollTop = top;
    if(nowOn){
      var row = stage.querySelector('.td-item[data-id="'+id+'"]');
      if(row){
        row.classList.add('just');
        var ck = row.querySelector('.ti-ck');
        if(ck){
          var pop=document.createElement('span'); var hp=hitPick(); pop.className='hit-pop hp-'+hp.replace('hit-','');
          pop.style.setProperty('--hit', 'url(assets/icons/'+hp+'.png)');
          ck.appendChild(pop);
          pop.addEventListener('animationend', function(){ if(pop.parentNode) pop.parentNode.removeChild(pop); });
          setTimeout(function(){ if(pop.parentNode) pop.parentNode.removeChild(pop); }, 900);
        }
      }
    }
    if(allDone){
      confetti();
    }
  }

  /* ---- weekly check-in overlay (goal-setting Mon–Fri · reflective Sat–Sun) ---- */
  var reflect=null, rfMode='goal', rfRating=null, rfPick=[], rfMood=null, rfHelp=null;
  function togglePick(id){
    var i = rfPick.indexOf(id);
    if(i>=0){ rfPick.splice(i,1); }
    else if(rfPick.length < FOCUS_MAX){ rfPick.push(id); }
    // at FOCUS_MAX the unselected chips are disabled, so extra picks are ignored
  }
  function syncFocusChips(){
    if(!reflect) return;
    var wrap=reflect.querySelector('.fchips'); if(!wrap) return;
    var full = rfPick.length>=FOCUS_MAX;
    [].forEach.call(wrap.querySelectorAll('.fchip'), function(btn){
      var on = rfPick.indexOf(btn.getAttribute('data-id'))>=0;
      btn.classList.toggle('on', on);
      btn.classList.toggle('disabled', full && !on);
      btn.disabled = full && !on;
    });
  }
  // single-choice option as a flowing sentence: "**Sterk**, het ging lekker deze week"
  function ciOpt(o, on, act){
    return '<button class="rateb'+(on?' on':'')+'" data-act="'+act+'" data-r="'+o.r+'">'+
      '<span class="re">'+o.em+'</span>'+
      '<span class="rtxt"><b>'+o.t+'</b>, '+o.s+'</span>'+
      '<span class="rok">'+IC.check+'</span></button>';
  }
  function ciSel(el){
    var wrap=el&&el.parentNode; if(!wrap) return;
    [].forEach.call(wrap.querySelectorAll('.rateb'), function(b){ b.classList.toggle('on', b===el); });
  }
  var WENT_OPTS = [
    {r:'sterk',  em:'💪', t:'Sterk', s:'het ging lekker deze week'},
    {r:'oke',    em:'🙂', t:'Oké', s:'een paar dingen waren lastig'},
    {r:'pittig', em:'😅', t:'Pittig', s:'ik wil meer oefenen'}
  ];
  var HELP_OPTS = [
    {r:'ja',     em:'👍', t:'Ja', s:'precies goed'},
    {r:'beetje', em:'🤏', t:'Een beetje', s:'sommige wel'},
    {r:'nee',    em:'👎', t:'Niet echt', s:'liever iets anders'}
  ];
  // ---- layout variants (compare on device with ?compare=1 or ?ux=accordion|swipe|page) ----
  var _ciUxParam=(function(){ var m=/[?&]ux=(page|accordion|swipe)/.exec(location.search||''); return m?m[1]:null; })();
  // Kaarten (swipe) is the chosen check-in layout. The layout switcher is opt-in via ?compare=1
  // (kept for reference/testing); ?ux=page|accordion|swipe still forces a layout.
  var _ciCompare=/[?&]compare=1/.test(location.search||'');
  var CI_UX=_ciUxParam || 'swipe';
  function setCiUx(u){ CI_UX=u; try{ localStorage.setItem('ciUx',u); }catch(e){} }
  function optInfo(arr,r){ for(var i=0;i<arr.length;i++) if(arr[i].r===r) return arr[i]; return null; }
  function focusShortFrom(ids){
    var labels=ids.map(function(id){ return focusLabel(id).label; });
    if(labels.length<=2) return labels.join(' · ');
    return labels.slice(0,2).join(' · ')+' +'+(labels.length-2);
  }
  // one shared question model, rendered three ways (page / accordion / swipe)
  function ciQuestions(){
    if(rfMode==='goal') return [
      { id:'mood', q:'Hoe voel je je deze week?', hint:'Zo stemt je coach de uitdaging af.',
        opts:function(){ return '<div class="rate">'+MOOD_OPTS.map(function(o){ return ciOpt(o, rfMood===o.r, 'pickmood'); }).join('')+'</div>'; },
        answered:function(){ return !!rfMood; },
        summary:function(){ var m=moodInfo(rfMood); return m?m.em+' '+m.t:''; } },
      { id:'focus', q:'Waar wil je op letten?', hint:'Kies er 1 tot 5 om deze week centraal te zetten.',
        opts:function(){ var full=rfPick.length>=FOCUS_MAX; return '<div class="fchips">'+FOCUS_AREAS.map(function(fa){
            var on=rfPick.indexOf(fa.id)>=0, dis=full&&!on;
            return '<button class="fchip'+(on?' on':'')+(dis?' disabled':'')+'"'+(dis?' disabled':'')+' data-act="pickfocus" data-id="'+fa.id+'">'+
              '<span class="fe">'+fa.em+'</span><span>'+fa.label+'</span><span class="fck">'+IC.check+'</span></button>';
          }).join('')+'</div>'; },
        answered:function(){ return rfPick.length>0; },
        summary:function(){ return rfPick.length?focusShortFrom(rfPick):''; } }
    ];
    return [
      { id:'went', q:'Hoe ging je training deze week?', hint:'Eerlijk zijn helpt je coach.',
        opts:function(){ return '<div class="rate">'+WENT_OPTS.map(function(o){ return ciOpt(o, rfRating===o.r, 'pickwent'); }).join('')+'</div>'; },
        answered:function(){ return !!rfRating; },
        summary:function(){ var o=optInfo(WENT_OPTS,rfRating); return o?o.em+' '+o.t:''; } },
      { id:'helpful', q:'Hielpen de voorgestelde trainingen?', hint:'Zo weet je coach wat werkt.',
        opts:function(){ return '<div class="rate">'+HELP_OPTS.map(function(o){ return ciOpt(o, rfHelp===o.r, 'pickhelp'); }).join('')+'</div>'; },
        answered:function(){ return !!rfHelp; },
        summary:function(){ var o=optInfo(HELP_OPTS,rfHelp); return o?o.em+' '+o.t:''; } }
    ];
  }
  function ciMeta(){
    return rfMode==='goal'
      ? { icon:'doel', k:'DOELSTELLING · WK '+weekNo(), h:'Zet je doel voor deze week', sub:'Twee snelle keuzes — daarna kun je los.' }
      : { icon:'reflectie', k:'REFLECTIE · WK '+weekNo(), h:'Hoe was jouw week?', sub:'Eerlijk zijn helpt je coach je beter te helpen.' };
  }
  function ciSwitcherInner(){
    var modes=[['page','Pagina'],['accordion','Accordeon'],['swipe','Kaarten']];
    return modes.map(function(m){ return '<button class="uxb'+(CI_UX===m[0]?' on':'')+'" data-act="setux" data-ux="'+m[0]+'">'+m[1]+'</button>'; }).join('');
  }
  function openCheckin(mode){
    rfMode = (mode==='goal'||mode==='reflect') ? mode : weekPhase();
    rfRating = WEEK_RATING; rfPick = WEEK_FOCUS.slice(); rfMood = WEEK_MOOD; rfHelp = WEEK_HELP;
    reflect = document.createElement('div');
    reflect.className='session reflect onepage'; reflect.id='reflect';
    applyTheme(reflect, CUR);
    reflect.innerHTML =
      '<div class="shead">'+
        '<button class="sx" data-act="rclose" aria-label="Sluiten">'+IC.x+'</button>'+
      '</div>'+
      '<div class="sbody" id="rfbody"></div>'+
      '<div class="sfoot" id="rffoot"></div>';
    stage.appendChild(reflect);
    fnav.classList.add('hide');
    requestAnimationFrame(function(){ reflect.classList.add('show'); });
    renderCheckin();
  }
  function closeCheckin(){
    if(!reflect) return;
    ciStopBlink();
    reflect.classList.remove('show');
    var r=reflect; reflect=null;
    setTimeout(function(){ if(r&&r.parentNode) r.parentNode.removeChild(r); }, 300);
    fnav.classList.remove('hide');
  }
  function ciSave(){
    if(rfMode==='goal'){ WEEK_FOCUS = rfPick.slice(); WEEK_MOOD = rfMood; weekGoalSet = true; }
    else { WEEK_RATING = rfRating; WEEK_HELP = rfHelp; weekReflected = true; }
  }
  function ciValid(){
    return rfMode==='goal' ? !!(rfMood && rfPick.length) : !!(rfRating && rfHelp);
  }
  // Submit saves every answer at once and drops straight back to Vandaag.
  function ciSubmit(){
    if(!reflect || !ciValid()) return;
    ciSave(); closeCheckin(); showScreen('today');
  }
  function syncSubmit(){
    if(!reflect) return;
    var foot=reflect.querySelector('#rffoot'); if(!foot) return;
    foot.innerHTML = ciValid()
      ? '<button class="nextbtn" data-act="cisubmit">'+(rfMode==='goal'?'Doel opslaan':'Opslaan')+' '+IC.check+'</button>'
      : '<button class="nextbtn ghost" disabled style="opacity:.45">'+(rfMode==='goal'?'Kies je gevoel én focus':'Beantwoord beide vragen')+'</button>';
  }
  function ciTitle(icon,k,h,sub){
    return '<div class="cihead"><span class="ci-badge '+icon+'" aria-hidden="true"></span>'+
      '<div class="k">'+k+'</div><h2>'+h+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>';
  }
  function ciQ(q,hint,inner){
    return '<section class="qblock"><h3 class="qh">'+q+'</h3>'+(hint?'<p class="qhint">'+hint+'</p>':'')+inner+'</section>';
  }
  /* ===== variant A: single page (all questions stacked) ===== */
  function renderPage(){
    var qs=ciQuestions();
    return '<div class="stepin">'+
      qs.map(function(x){ return ciQ(x.q,x.hint,x.opts()); }).join('')+'</div>';
  }

  /* ===== variant B: accordion (one question open at a time; tap a row to reopen it) ===== */
  function renderAccordion(){
    var qs=ciQuestions();
    return '<div class="stepin">'+
      '<div class="acclist">'+qs.map(function(x,i){
        return '<div class="acc" data-q="'+x.id+'">'+
          '<button class="acc-h" data-act="acctoggle" data-q="'+x.id+'">'+
            '<span class="acc-n">'+(i+1)+'</span>'+
            '<span class="acc-qt"><span class="acc-q">'+x.q+'</span>'+
              '<span class="acc-a">'+(x.answered()?esc(x.summary()):'Tik om te kiezen')+'</span></span>'+
            '<span class="acc-chev">'+IC.chev+'</span>'+
          '</button>'+
          '<div class="acc-b"><div class="acc-bin">'+x.opts()+'</div></div>'+
        '</div>';
      }).join('')+'</div></div>';
  }
  function accEl(qid){ return reflect?reflect.querySelector('.acc[data-q="'+qid+'"]'):null; }
  function accResize(qid){ var el=accEl(qid); if(!el||!el.classList.contains('open'))return; var b=el.querySelector('.acc-b'); b.style.maxHeight=b.scrollHeight+'px'; }
  function accOpen(qid){
    if(!reflect) return;
    [].forEach.call(reflect.querySelectorAll('.acc'), function(el){
      var open=el.getAttribute('data-q')===qid;
      el.classList.toggle('open',open);
      var b=el.querySelector('.acc-b');
      b.style.maxHeight = open ? b.scrollHeight+'px' : '0px';
    });
  }
  function accOpenNone(){ if(!reflect) return; [].forEach.call(reflect.querySelectorAll('.acc'), function(el){ el.classList.remove('open'); el.querySelector('.acc-b').style.maxHeight='0px'; }); }
  function accInit(){
    var qs=ciQuestions(), openId=null;
    for(var i=0;i<qs.length;i++){ if(!qs[i].answered()){ openId=qs[i].id; break; } }
    if(openId) accOpen(openId); else accOpenNone();
  }
  function accSummary(qid){
    var el=accEl(qid); if(!el) return;
    var qs=ciQuestions(), x=null; qs.forEach(function(q){ if(q.id===qid) x=q; });
    if(!x) return;
    var a=el.querySelector('.acc-a'); if(a) a.textContent = x.answered()?x.summary():'Tik om te kiezen';
    el.classList.toggle('done', x.answered());
  }
  function accToggle(qid){ var el=accEl(qid); if(!el)return; if(el.classList.contains('open')) accOpenNone(); else accOpen(qid); }
  function accAdvance(qid){
    accSummary(qid);
    var qs=ciQuestions(), idx=-1, i, nextId=null;
    for(i=0;i<qs.length;i++) if(qs[i].id===qid) idx=i;
    for(i=idx+1;i<qs.length;i++){ if(!qs[i].answered()){ nextId=qs[i].id; break; } }
    if(!nextId) for(i=0;i<qs.length;i++){ if(!qs[i].answered()){ nextId=qs[i].id; break; } }
    if(nextId) accOpen(nextId); else accOpenNone();
  }

  /* ===== variant C: vertical swipe cards (scroll-snap; auto-advances on answer) ===== */
  function renderSwipe(){
    var qs=ciQuestions(), n=qs.length;
    return qs.map(function(x,i){
      return '<section class="qcard" data-q="'+x.id+'"><div class="qcard-in">'+
        '<span class="qc-count">Vraag '+(i+1)+' / '+n+'</span>'+
        '<h2 class="qc-q">'+x.q+'</h2>'+(x.hint?'<p class="qc-sub">'+x.hint+'</p>':'')+
        '<div class="qc-opts">'+x.opts()+'</div>'+
      '</div>'+
      '</section>';
    }).join('');
  }
  function swipeInit(){
    /* Overlaid title collapses as you scroll toward the next card: drives --cic (0 -> 1) from the
       scroll position so the title lifts/shrinks/fades and each question card gets the full height.
       Forward is gated (swipeSyncLocks): the next card stays hidden until this one is answered, so
       there's no "swipe up" guidance to show — answering auto-advances. Swiping back is always free. */
    if(CI_UX!=='swipe' || !reflect) return;
    var body=reflect.querySelector('#rfbody'), ttl=reflect.querySelector('.ci-topttl'),
        shead=reflect.querySelector('.shead');
    if(!body || !ttl) return;
    if(shead) ttl.style.top=shead.offsetHeight+'px';
    reflect.style.setProperty('--cic','0');
    // Title docks 1:1 with the scroll (denom matches the title's -150px translate) so a rising
    // card can't sneak under it; past 150px it's parked as the compact header in the top bar.
    var denom=150;
    function upd(){
      if(!reflect) return;
      var c=body.scrollTop/denom; c=c<0?0:c>1?1:c;
      reflect.style.setProperty('--cic', c.toFixed(3));
    }
    if(body._ciScroll) body.removeEventListener('scroll', body._ciScroll);
    body._ciScroll=upd;
    body.addEventListener('scroll', upd, {passive:true});
    upd();
    swipeSyncLocks();
  }
  // Progressive gating: a question card is reachable only once every EARLIER question is answered.
  // Locked cards are display:none, so scroll-snap can't reach them (the user must answer Q1 before
  // Q2). Earlier cards stay visible, so swiping back to a previous question always works.
  function swipeSyncLocks(){
    if(CI_UX!=='swipe' || !reflect) return;
    var body=reflect.querySelector('#rfbody'); if(!body) return;
    var qs=ciQuestions(), cards=[].slice.call(body.querySelectorAll('.qcard')), locked=false;
    for(var i=0;i<cards.length;i++){
      cards[i].classList.toggle('locked', locked);
      if(!qs[i] || !qs[i].answered()) locked=true; // everything past the first unanswered question is locked
    }
  }
  function swipeAdvance(qid){
    if(!reflect) return;
    var body=reflect.querySelector('#rfbody'); if(!body) return;
    var cards=[].slice.call(body.querySelectorAll('.qcard'));
    for(var i=0;i<cards.length;i++){
      if(cards[i].getAttribute('data-q')===qid){
        var next=cards[i+1]; if(!next) break;
        setTimeout(function(c){ return function(){
          // centre the next card (matches scroll-snap-align:center) with a slow, manual-like glide
          var br=body.getBoundingClientRect(), cr=c.getBoundingClientRect();
          var target=body.scrollTop + (cr.top+cr.height/2) - (br.top+body.clientHeight/2);
          rfGlide(body, Math.max(0, Math.round(target)), 820);
        }; }(next), 180);
        break;
      }
    }
  }
  // Slow, eased scroll for the check-in swipe flow. Native smooth-scroll is fixed and snappy, so
  // this rAF tween stretches the duration and softens the easing to feel like a gentle manual
  // scroll. Snap + CSS smooth-scroll are disabled during the tween so they don't fight it, then
  // restored — we land exactly on the card's centre snap point, so re-enabling snap won't jump.
  function rfGlide(body, target, dur){
    if(!body) return;
    if(body._rfRAF){ cancelAnimationFrame(body._rfRAF); if(body._rfDone) body._rfDone(); }
    var start=body.scrollTop, dist=target-start;
    var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || Math.abs(dist)<2){ var pb0=body.style.scrollBehavior; body.style.scrollBehavior='auto'; body.scrollTop=target; body.style.scrollBehavior=pb0; return; }
    var prevBeh=body.style.scrollBehavior, prevSnap=body.style.scrollSnapType, done=false;
    body.style.scrollBehavior='auto'; body.style.scrollSnapType='none';
    function finish(){
      if(done) return; done=true;
      body.style.scrollBehavior=prevBeh; body.style.scrollSnapType=prevSnap;
      body.removeEventListener('touchstart',onGrab); body.removeEventListener('wheel',onGrab);
      body._rfRAF=0; body._rfDone=null;
    }
    body._rfDone=finish;
    function onGrab(){ if(body._rfRAF) cancelAnimationFrame(body._rfRAF); finish(); } // user takes over → hand back to native snap
    body.addEventListener('touchstart',onGrab,{passive:true});
    body.addEventListener('wheel',onGrab,{passive:true});
    function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; } // easeInOutCubic
    var t0=0;
    function frame(ts){
      if(!t0) t0=ts;
      var p=(ts-t0)/dur; if(p>1) p=1;
      body.scrollTop=start+dist*ease(p);
      if(p<1){ body._rfRAF=requestAnimationFrame(frame); }
      else { body.scrollTop=target; finish(); }
    }
    body._rfRAF=requestAnimationFrame(frame);
  }

  // shared post-pick behaviour across the three layouts
  function ciAfterPick(qid, el){
    if(el) ciSel(el);
    if(CI_UX==='accordion') accAdvance(qid);
    else if(CI_UX==='swipe'){ swipeSyncLocks(); swipeAdvance(qid); }
    syncSubmit();
  }
  function ciAfterFocus(){
    syncFocusChips();
    if(CI_UX==='accordion') accResize('focus');
    else if(CI_UX==='swipe') swipeSyncLocks();
    syncSubmit();
  }
  // corner belt graphic recolours to the current grade (solid primary; poom stays black)
  function ciPaintBelt(node){
    var g=geupInfo(GEUP_I);
    node.style.setProperty('--belt-main', g.col);
    node.style.setProperty('--belt-dark', shade(g.col,-38));
  }
  function renderCheckin(){
    if(!reflect) return;
    var m=ciMeta();
    reflect.classList.remove('ux-page','ux-accordion','ux-swipe'); reflect.classList.add('ux-'+CI_UX);
    ['.swipedots','.uxswitch','.ci-topttl','.ci-topmasc','.ci-beltband'].forEach(function(sel){ var e=reflect.querySelector(sel); if(e) e.parentNode.removeChild(e); });
    var bodyEl=reflect.querySelector('#rfbody'), footEl=reflect.querySelector('#rffoot');
    // greeting-style title at the top (like Vandaag); goal shows the cheering kid, reflect the coiled belt
    var beltHtml = '<span class="bb-belt">'+
        '<span class="cb cb-main"></span><span class="cb cb-dark"></span><span class="cb cb-ink"></span>'+
      '</span>';
    var mascHtml = rfMode==='goal'
      ? '<span class="ci-tt-masc"><span class="gm-b">'+
          '<img class="gm-i" src="assets/img/goal-kid.png" alt="" aria-hidden="true">'+
          '<img class="gm-i gm-blink" src="assets/img/goal-kid-blink.png" alt="" aria-hidden="true">'+
        '</span></span>'
      : '<span class="ci-tt-belt" aria-hidden="true">'+beltHtml+'</span>';
    // Swipe reflect: the belt is a small flat graphic ABOVE the kicker, inside the title flow, so it
    // never overlaps the text. Swipe goal keeps the cheering kid in its own layer behind the cards.
    var inlineBelt = (CI_UX==='swipe' && rfMode!=='goal')
      ? '<span class="ci-tt-beltflat" aria-hidden="true">'+beltHtml+'</span>' : '';
    var ttl=document.createElement('div'); ttl.className='ci-topttl'+(rfMode==='goal'?' has-masc':' has-belt');
    ttl.innerHTML='<div class="ci-tt-txt">'+inlineBelt+'<div class="k">'+m.k+'</div><h2>'+m.h+'</h2></div>'+(CI_UX==='swipe'?'':mascHtml);
    reflect.insertBefore(ttl, bodyEl);
    if(CI_UX==='swipe' && rfMode==='goal'){ var mL=document.createElement('div'); mL.className='ci-topmasc has-masc'; mL.innerHTML=mascHtml; reflect.insertBefore(mL, bodyEl); }
    if(_ciCompare){ var d=document.createElement('div'); d.className='uxswitch'; d.innerHTML=ciSwitcherInner(); reflect.insertBefore(d, bodyEl); }
    bodyEl.innerHTML = CI_UX==='accordion' ? renderAccordion() : CI_UX==='swipe' ? renderSwipe() : renderPage();
    bodyEl.scrollTop=0;
    // reflect: the coiled belt recolours to the current grade (belt lives in ttl for page/accordion, in the mascot layer for swipe)
    if(rfMode!=='goal'){ var bb=reflect.querySelector('.bb-belt'); if(bb) ciPaintBelt(bb); }
    if(CI_UX==='accordion') requestAnimationFrame(accInit);
    if(CI_UX==='swipe') requestAnimationFrame(swipeInit);
    if(rfMode==='goal') ciScheduleBlink(); else ciStopBlink();
    syncSubmit();
  }

  /* ---- boot ---- */
  function boot(){ setBelt(GEUP_I, false); renderToday(); scheduleBlink();
    requestAnimationFrame(moveNavHL); setTimeout(moveNavHL, 320);
    // preview deep-link: ?open=1 (optionally &ci=goal|reflect) opens the weekly check-in on load
    if(/[?&]open=1/.test(location.search||'')) setTimeout(function(){ openCheckin(_ciOverride||'reflect'); }, 90); }
  if(poomsae.length){ boot(); }
  else {
    // data not ready yet (shouldn't happen — script loaded before)
    var tries=0, iv=setInterval(function(){
      C=window.CURRICULUM||{}; poomsae=C.poomsae||[];
      if(poomsae.length||++tries>20){ clearInterval(iv); if(poomsae.length) boot(); }
    },80);
  }
})();
</script>
<script>
  /* Offline-first: registreer dezelfde service worker als de hoofd-app.
     Zo blijft de coach werken zonder server (op je startscherm/https). */
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadController || reloaded) return;
      reloaded = true; window.location.reload();
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function(e){ console.warn('SW mislukt', e); });
    });
  }
</script>
