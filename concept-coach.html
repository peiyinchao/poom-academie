  /* ---- Coach-scherm ---------------------------------------------------------------
     Eén pagina per weekdag. De dag van vandaag staat vooraan geselecteerd, zodat de app
     bij het openen meteen laat zien wat er vandaag te doen is; de andere dagen zijn er om
     vooruit te plannen. Elke regel is een snelkoppeling naar het echte onderdeel in de
     app, met daaronder de timer en de filmpjes die eraan gekoppeld zijn. */
  var plSel = null;                                  // gekozen weekdag; null = volg vandaag
  function plToday(){ return new Date().getDay(); }
  function plCur(){ return plSel===null ? plToday() : plSel; }

  function plWeekHtml(){
    var today=plToday(), cur=plCur();
    return '<div class="pl-week">'+PL_DAYS.map(function(d){
      var n=plDay(d.d).length;
      var dots=''; for(var i=0;i<Math.min(n,3);i++) dots+='<i></i>';
      return '<button class="pl-day'+(d.d===cur?' on':'')+(d.d===today?' today':'')+'" '+
        'data-act="plday" data-d="'+d.d+'" aria-label="'+esc(d.label)+' — '+n+' onderdelen"'+
        (d.d===cur?' aria-current="true"':'')+'>'+
        '<span class="pl-dnum">'+d.s.toUpperCase()+'</span>'+
        '<span class="pl-dots">'+dots+'</span>'+
      '</button>';
    }).join('')+'</div>';
  }
  // "Auto" heeft geen eigen inhoud: het leent de missies van de dagkaart. Op een andere dag dan
  // vandaag zijn dat de missies die dán gelden, dus daar tonen we alleen de belofte.
  function plAutoChips(isToday){
    if(!isToday) return '<span class="pl-chip"><span class="pl-ctx">De missies van die dag</span></span>';
    return todaysMissions().map(function(m){
      return '<button class="pl-chip" data-act="plmiss" data-id="'+esc(m.id)+'">'+
        '<span class="pl-cdot">'+IC.chev+'</span><span class="pl-ctx">'+esc(m.label)+'</span></button>';
    }).join('');
  }
  function plChipsHtml(it, isToday){
    var out='';
    if(it.k==='auto') out += plAutoChips(isToday);
    if(it.min) out += '<button class="pl-chip tmr" data-act="pltimer" data-min="'+it.min+'">'+
      '⏱ <b>'+it.min+' min</b></button>';
    (it.vids||[]).forEach(function(vid){
      var v=vdById(vid); if(!v) return;
      var th=vdThumb(v);
      out += '<a class="pl-chip" href="'+esc(vdUrl(v))+'" target="_blank" rel="noopener noreferrer">'+
        (th?'<img class="pl-cthumb" src="'+esc(th)+'" alt="" loading="lazy" decoding="async">':'')+
        '<span class="pl-ctx">'+esc(v.title||'Filmpje')+'</span></a>';
    });
    return out ? '<div class="pl-chips">'+out+'</div>' : '';
  }
  function plItemHtml(it, isToday){
    var c=plComp(it.k); if(!c) return '';
    var nv=(it.vids||[]).filter(function(id){ return !!vdById(id); }).length;
    var bits=[]; if(it.min) bits.push(it.min+' min');
    if(nv) bits.push(nv+(nv===1?' filmpje':' filmpjes'));
    var sub = bits.length ? bits.join(' · ') : c.hint;
    var done = isToday && plIsDone(it.id);
    return '<div class="pl-item'+(done?' done':'')+'">'+

          : '<span class="pl-ck pl-ckoff" aria-hidden="true"></span>')+
        '<button class="pl-go" data-act="plgo" data-k="'+esc(it.k)+'" data-min="'+(it.min||0)+'">'+

     onderdelen die dat niet hebben (opwarmen, cooling down, taeryon) openen de oefentimer, want
     dat is daar het bruikbaarste gereedschap. */
  function plGo(k, min){
    if(k==='auto'){ closeCoach(); showScreen('today'); return; }
    if(k==='poomsae' || k==='hosinsul' || k==='woorden'){ closeCoach(); missionGo(k); return; }

    plOpenTimer(min || plComp(k).min || 3);

  /* ---------- Tijdlijn: de taekwondo-geschiedenis van de leerling ----------
     Graden en agenda-events stonden al in de app, maar alles wat voorbij was verdween uit beeld.
     De tijdlijn zet ze samen op één lijn, nieuw naar oud, met plaats, uitslag en foto erbij. */
  var tlScreen=null;
  function tlYear(iso){ return String(iso||'').slice(0,4); }
  function tlItems(){
    var out=[], high=geupHighest();
    for(var k in GEUP_DATES){
      if(!GEUP_DATES.hasOwnProperty(k) || !GEUP_DATES[k]) continue;
      var ki=+k, g=geupInfo(ki), toISO=null;
      // Hoe lang hij deze graad droeg: tot de volgende graduatie, of tot vandaag als het de hoogste is.
      if(ki<high){ for(var j=ki+1;j<GEUPS.length;j++){ if(GEUP_DATES[j]){ toISO=GEUP_DATES[j]; break; } } }
      var span=geupSpan(GEUP_DATES[k], toISO);
      out.push({kind:'graad', id:'g'+k, date:GEUP_DATES[k], geup:ki, gm:gmGet(ki),
                title:g.grade, sub:g.band, col:g.col,
                note: span ? ((ki>=high?'al ':'')+span+' in deze graad') : 'Graad behaald'});
    }
    for(var i=0;i<AGENDA.length;i++){
      var e=AGENDA[i], t=agType(e.type);
      out.push({kind:'event', id:e.id, date:e.date, end:e.end,
                title:e.title||t.label, ico:t.ico, tk:t.k, typ:t.label, ev:e});
    }
    out.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    return out;
  }
  function tlWhen(it){
    var s=fmtDateNL(it.date);
    if(it.end && it.end>it.date){
      var a=String(it.date).split('-'), b=String(it.end).split('-');
      s = (a[0]===b[0] && a[1]===b[1]) ? ((+a[2])+'–'+fmtDateNL(it.end)) : (s+' – '+fmtDateNL(it.end));
    }
    return s;
  }
  /* Welke band droeg je op deze datum? De hoogste graad die je toen al gehaald had. Een
     graduatie kleurt dus vanaf zijn eigen datum, want die dag ging de nieuwe band om. */
  function tlBeltAt(iso){
    var best=-1, k;
    for(k in GEUP_DATES){
      if(!GEUP_DATES.hasOwnProperty(k) || !GEUP_DATES[k]) continue;
      if(GEUP_DATES[k]<=iso && (+k)>best) best=+k;
    }
    return best<0 ? null : geupInfo(best);
  }
  /* De band die je vóór deze graduatie droeg: de hoogste graad eronder die je gehaald hebt.
     Zonder voorganger droeg je nog geen band. Die aanloop krijgt dus niet alvast het wit van je
     10e geup — dan zou de kleur al onder de halte beginnen, terwijl je hem daar nog niet had.
     Hij houdt de gewone lijnkleur, net als de gebeurtenissen eronder, zodat wit precies in het
     hart van de examenhalte begint en de lijn eronder ononderbroken doorloopt naar het uitdoven. */
  function tlBeltVoor(geup){
    var best=-1, k;
    for(k in GEUP_DATES){
      if(!GEUP_DATES.hasOwnProperty(k) || !GEUP_DATES[k]) continue;
      if((+k)<(+geup) && (+k)>best) best=+k;
    }
    return best<0 ? null : geupInfo(best);
  }
  /* Twee bandkleuren op één lijn: twee sporen naast elkaar, zoals op een metrokaart waar twee
     lijnen een stuk samen lopen. Bij 6px krijgt elke kleur een hele 3px, dus de breuk valt op
     een echte pixelgrens en niet halverwege eréén. */
  /* De witte band is elders een warm gebroken wit; op de crèmekleurige pagina viel die lijn
     helemaal weg. Op de lijn gebruiken we daarom vol wit, precies zoals de kaarten: wit met een
     haarlijntje eromheen leest wél als wit. Alleen hier, zodat de bandkleur elders niet wijzigt. */
  function tlKleur(c){ return c==='#EDEDE7' ? '#FFFFFF' : c; }
  /* Nog geen enkele band gehaald? Dan is de lijn wit: de aanloop naar je 10e geup. Onderaan dooft
     hij weg naar niets (zie het masker op het laatste blok), zodat de reis uit het niets begint. */
  function tlLijnCss(g){
    if(!g) return '#FFFFFF';
    return g.col2
      ? 'linear-gradient(90deg,'+tlKleur(g.col)+' 0 50%,'+tlKleur(g.col2)+' 50% 100%)'
      : tlKleur(g.col);
  }
  /* Voor de omslag op een graduatie moet de bovenste laag altijd een verloop zijn: een kale
     kleur kun je in een background-laag niet op hoogte zetten, een verloop wel. */
  function tlLijnLaag(g){
    if(!g) return 'linear-gradient(#FFFFFF 0 100%)';
    return g.col2
      ? 'linear-gradient(90deg,'+tlKleur(g.col)+' 0 50%,'+tlKleur(g.col2)+' 50% 100%)'
      : 'linear-gradient('+tlKleur(g.col)+' 0 100%)';
  }
  function tlKleurStijl(iso){
    var g=tlBeltAt(iso);
    if(!g) return '';
    return ' style="--tlcol:'+esc(tlLijnCss(g))+'"';
  }
  /* Op een graduatieblok slaat de lijn halverwege om: boven de halte de band die je vanaf dat
     moment droeg, eronder de vorige. Zo zit de kleurbreuk precies op de halte in plaats van op
     een kaartrand — geen trapje meer in de lijn. */
  function tlOmslagStijl(it){
    var g=geupInfo(it.geup), pre=tlBeltVoor(it.geup);
    return ' style="--tlcol:'+esc(tlLijnCss(g))+
      ';--tlcoln:'+esc(tlLijnLaag(g))+';--tlcolp:'+esc(pre?tlLijnCss(pre):'var(--line)')+'"';
  }
  /* Hoeveel witte strepen hoort de lijn boven deze halte te dragen? Dat is het aantal strepen
     van de band die je ná deze gebeurtenis droeg: bij een graduatie de nieuwe band, anders
     gewoon de band van die dag. Alleen de poom-banden hebben er (1e poom één, 2e poom twee). */
  function tlStreepKlas(it){
    var g = it.kind==='graad' ? geupInfo(it.geup) : tlBeltAt(it.date);
    var n = (g && g.lines) || 0;
    return n ? ' tl-str'+Math.min(2, n) : '';
  }
  /* Welk tekentje hoort in de halte? Een graduatie deelt de baret met een examen: allebei zijn
     ze het moment waarop je je band verdiende. De andere twee soorten hebben hun eigen tekening.
     Kent een soort er geen, dan valt hij terug op het teken uit de agenda zelf. */
  var TL_ICOS = {wedstrijd:'ic-tl-wedstrijd', examen:'ic-tl-examen', cursus:'ic-tl-cursus'};
  function tlDotHtml(it){
    /* De bandkleur zit in de lijn en in de ring, dus de halte hoeft hem niet nog eens te dragen. */
    var k = it.kind==='graad' ? 'examen' : it.tk;
    if(TL_ICOS[k]) return '<span class="tl-dot"><i class="tl-ico '+TL_ICOS[k]+'"></i></span>';
    return '<span class="tl-dot">'+(it.ico||'🎓')+'</span>';
  }
  function tlItemHtml(it, today){
    var ph = phGet(it.id), foc = phFoc(it.id);
    var ph2 = ph ? phGet(phId2(it.id)) : '', foc2 = phFoc(phId2(it.id));
    var fut = it.date>today;
    var meta=[];
    if(it.kind==='event'){
      if(it.ev.where) meta.push(esc(it.ev.where));
      if(fut) meta.push('<i>'+agCount(it.ev)+'</i>');
    } else {
      meta.push(esc(it.sub));
    }
    // Bij iets wat nog moet komen valt er nog niks te vertellen; dan is "Aanpassen" eerlijker.
    var rich = it.kind==='event' ? (ph||agResultLijst(it.ev.result).length) : (ph||it.gm.exam);
    var edit = (fut||rich) ? 'Aanpassen' : 'Foto of uitslag toevoegen';
    if(it.kind==='graad' && !rich) edit='Foto of examinator toevoegen';
    /* De aanpassen-knop stond onder elke kaart en haalde de rust uit het beeld. Nu is de titel
       zelf aan te tikken en verschijnt er een potlood in de hoek zodra de kaart bovenaan komt:
       binnen bereik op het moment dat je ernaar kijkt, en verder onzichtbaar. */
    var ed = it.kind==='event'
      ? 'data-act="tledit" data-id="'+esc(it.id)+'"'
      : 'data-act="tlgrad" data-k="'+it.geup+'"';
    var gr = it.kind==='graad';
    return '<div class="tl-item'+(fut?' fut':'')+(gr?' tl-omslag':'')+tlStreepKlas(it)+'"'+
      (gr?tlOmslagStijl(it):tlKleurStijl(it.date))+'>'+
      tlDotHtml(it)+
      '<div class="tl-card">'+
        '<button class="tl-pen" '+ed+' aria-label="'+esc(edit)+'" title="'+esc(edit)+'">'+IC.potlood+'</button>'+
        '<span class="tl-date">'+esc(tlWhen(it))+'</span>'+
        '<b class="tl-ttl" role="button" tabindex="0" '+ed+'>'+esc(it.title)+'</b>'+
        (meta.length?'<span class="tl-meta">'+meta.join(' · ')+'</span>':'')+
        // Elke podiumplaats krijgt zijn eigen medaille en zijn eigen pil. Eén pil met twee
        // plaatsen erin leest als één uitslag, terwijl het er echt twee zijn — op een toernooi
        // met meerdere onderdelen kun je in het ene eerste en in het andere tweede worden.
        (it.kind==='event' ? agUitslagRijen(it.ev.result).filter(function(r){ return !!r.v; }).map(function(r){
          var p=agPlace(r.v);
          return '<span class="tl-res'+(p&&p.geenPodium?' plain':'')+'">'+(p?p.ico:'🏅')+' '+
            esc(agUitslagTekst(r))+'</span>';
        }).join('') : '')+
        // Wie de cursus gaf staat er net zo bij als de examinator bij een graduatie: dezelfde
        // regel, dezelfde toon. Het is een herinnering, geen prijs.
        (it.kind==='event'&&it.ev.trainers&&it.ev.trainers.length
          ? '<span class="tl-exam">'+(it.ev.trainers.length>1?'Trainers: ':'Trainer: ')+esc(it.ev.trainers.join(', '))+'</span>'
          : '')+
        (it.kind==='event'&&it.ev.exam
          ? '<span class="tl-exam">Examinator: '+esc(it.ev.exam)+'</span>' : '')+
        (it.kind==='graad'&&it.gm.exam?'<span class="tl-exam">Examinator: '+esc(it.gm.exam)+'</span>':'')+
        (ph?'<img class="tl-photo'+(foc.fit==='contain'?' fitc':'')+'" src="'+esc(ph)+'" '+
          'style="'+phFocStyle(foc)+'" alt="Foto bij '+esc(it.title)+'" '+
          'role="button" data-act="tlfoto" data-id="'+esc(it.id)+'">':'')+
        // De tweede foto krijgt zijn eigen sleutel mee, zodat vergroten hem vanzelf vindt.
        (ph2?'<img class="tl-photo'+(foc2.fit==='contain'?' fitc':'')+'" src="'+esc(ph2)+'" '+
          'style="'+phFocStyle(foc2)+'" alt="Tweede foto bij '+esc(it.title)+'" '+
          'role="button" data-act="tlfoto" data-id="'+esc(phId2(it.id))+'">':'')+
        (it.kind==='graad'?'<span class="tl-grad">🎓 '+esc(it.note)+'</span>':'')+
      '</div>'+
    '</div>';
  }
  function tlBodyHtml(){
    var all=tlItems(), today=todayISO();
    if(!all.length){
      return '<p class="tl-empty">Hier komt je taekwondo-verhaal te staan: je graden, wedstrijden, '+
        'examens en cursussen. Voeg je eerste gebeurtenis toe.</p>'+
        '<button class="tl-add" data-act="tlnew"><span class="add-lab">+ Gebeurtenis</span></button>';
    }
    var h='<div class="tl-line">', yr=null;
    for(var i=0;i<all.length;i++){
      var y=tlYear(all[i].date);
      // Het jaartal draagt de kleur van de gebeurtenis die eronder komt, zodat de lijn er
      // zonder kleurbreuk doorheen loopt.
      if(y!==yr){ yr=y; h+='<div class="tl-year"'+tlKleurStijl(all[i].date)+'><span>'+esc(yr)+'</span></div>'; }
      h+=tlItemHtml(all[i], today);
    }
    return h+'</div>';
  }
  function tlCountLine(){
    var n=tlItems().length;
    return n+' '+(n===1?'moment':'momenten')+' · jouw taekwondo-verhaal';
  }
  /* De telregel tekent het bovenste stukje lijn, dus hij moet dezelfde band dragen als het
     jaartal eronder: die van de bovenste gebeurtenis. Zonder verhaal is er niets om aan te
     hangen en blijft de regel kaal. */
  function tlLeadLijn(el){
    if(!el) return;
    var all=tlItems();
    el.classList.toggle('heeft-lijn', all.length>0);
    var g=all.length?tlBeltAt(all[0].date):null;
    if(g) el.style.setProperty('--tlcol', tlLijnCss(g)); else el.style.removeProperty('--tlcol');
  }
  function openTimeline(){
    if(tlScreen) return tlScreen;
    var el=document.createElement('div');
    el.className='session tlscreen'; el.id='tlscreen';
    applyTheme(el, CUR);
    el.innerHTML=
      '<div class="shead">'+
        '<button class="sx" data-act="tlexit" aria-label="Sluiten">'+IC.x+'</button>'+
        '<div class="pl-title"><span class="han-lab">발자취 · Baljachwi</span><h2>Jayden&#39;s TKD Tijdlijn</h2></div>'+
      '</div>'+
      '<div class="sbody" id="tl-scroll">'+
        '<p class="tl-lead" id="tl-lead">'+esc(tlCountLine())+'</p>'+
        '<div id="tl-body">'+tlBodyHtml()+'</div>'+
        /* Onderaan, niet bovenaan: je verhaal komt eerst, het veiligstellen ervan volgt.
           Wie ver genoeg doorrolt om hier te komen, heeft ook iets om te bewaren. */
        '<div class="tl-backup">'+
          '<p class="tl-backup-note" id="tl-backup-note">'+esc(backupRegel())+'</p>'+
          '<div class="tl-backup-act">'+
            '<button class="tl-edit" data-act="tlbackup">Reservekopie maken</button>'+
            '<button class="tl-edit" data-act="tlrestore">Terugzetten</button>'+
          '</div>'+
          '<input type="file" id="tl-restore-file" accept="application/json,.json" hidden>'+
        '</div>'+
      '</div>'+
      // Zwevend, zodat je vanaf elk punt in je verhaal een moment kunt toevoegen
      // zonder eerst helemaal naar beneden te scrollen.
      '<button class="tl-fab" data-act="tlnew" aria-label="Gebeurtenis toevoegen" title="Gebeurtenis toevoegen">'+
        '<span class="tl-fab-glint" aria-hidden="true"></span>'+IC.plus+'</button>';
    stage.appendChild(el);
    tlScreen=el;
    fnav.classList.add('hide');
    tlLeadLijn(el.querySelector('#tl-lead'));
    tlWire(el);
    requestAnimationFrame(function(){ el.classList.add('show'); tlNaTekenen(); });
    return el;
  }
  /* Eén plek waar al het gedrag van het tijdlijnscherm aan elkaar hangt: het potlood dat
     meeloopt met de scroll, de verloopranden en het veeggebaar om te sluiten. */
  function tlWire(el){
    var sc=el.querySelector('#tl-scroll');
    if(!sc) return;
    csFades(sc);
    sc.addEventListener('scroll', function(){ csEdgeFade(sc); tlAtop(sc); }, {passive:true});
    tlVeegTerug(el, sc);
  }
  function tlNaTekenen(){
    if(!tlScreen) return;
    var sc=tlScreen.querySelector('#tl-scroll');
    if(!sc) return;
    csFades(sc); csEdgeFade(sc); tlAtop(sc);
  }
  /* Welke kaart staat bovenaan? De laatste waarvan de bovenkant nog boven de leeslijn ligt.
     Zo hoort het potlood altijd bij de kaart waar je naar kijkt, ook als er eentje half buiten
     beeld hangt. Alleen de klas wisselen als hij echt verandert, anders flikkert de overgang. */
  function tlAtop(sc){
    var items=sc.querySelectorAll('.tl-item');
    if(!items.length) return;
    var lijn=sc.getBoundingClientRect().top + 72, kies=null, i, r;
    for(i=0;i<items.length;i++){
      r=items[i].getBoundingClientRect();
      if(r.top<=lijn && r.bottom>lijn+20){ kies=items[i]; break; }
    }
    if(!kies && sc.scrollTop<=2) kies=items[0];
    for(i=0;i<items.length;i++) items[i].classList.toggle('tl-atop', items[i]===kies);
  }
  /* Naar rechts vegen sluit de tijdlijn, net als bij het handboek. Met één hand is de X
     linksboven nauwelijks te halen; een veeg vanaf het midden wel. */
  function tlVeegTerug(el, sc){
    var x0=0,y0=0,down=false,swiped=false;
    el.addEventListener('pointerdown', function(e){
      if(e.pointerType==='mouse' && e.button!==0) return;
      x0=e.clientX; y0=e.clientY; down=true; swiped=false;
    });
    el.addEventListener('pointermove', function(e){
      if(!down || swiped) return;
      var dx=e.clientX-x0, dy=e.clientY-y0;
      if(Math.abs(dx)<=Math.abs(dy)*1.4) return;       // je rolt verticaal — met rust laten
      if(dx>60){ swiped=true; down=false; closeTimeline(true); }
    });
    el.addEventListener('pointerup', function(){ down=false; });
    el.addEventListener('pointercancel', function(){ down=false; });
    el.addEventListener('click', function(e){
      if(swiped){ e.stopPropagation(); e.preventDefault(); swiped=false; }
    }, true);
  }
  function closeTimeline(naarRechts){
    if(!tlScreen) return;
    tlScreen.classList.remove('show');
    if(naarRechts) tlScreen.classList.add('tl-weg');
    var s=tlScreen; tlScreen=null;
    setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); }, 380);
    fnav.classList.remove('hide');
  }
  function tlRefresh(){
    if(!tlScreen) return;
    var b=tlScreen.querySelector('#tl-body'); if(b) b.innerHTML=tlBodyHtml();
    var l=tlScreen.querySelector('#tl-lead'); if(l){ l.textContent=tlCountLine(); tlLeadLijn(l); }
    tlNaTekenen();
  }
  /* Een foto op een kaart is klein en bijgesneden. Aantikken laat hem in zijn geheel zien,
     zonder bijsnijden, met een tik naast de foto om weer terug te gaan. */
  function tlFotoGroot(id){
    var src=phGet(id); if(!src) return;
    var ov=document.createElement('div');
    ov.className='tl-lb'; ov.setAttribute('role','dialog');
    ov.innerHTML='<button class="tl-lb-x" aria-label="Sluiten">'+IC.x+'</button>'+
                 '<img src="'+esc(src)+'" alt="Foto, vergroot">';
    var weg=function(){
      ov.classList.remove('show');

  /* ---- mastery growth (seed -> sprout -> bloom, per category) ---- */

  var MASTERY = (function(){

  var BLOOM_FILES=['Bloom1','Bloom3','Bloom4','Bloom5','Bloom6','Bloom7','Bloom8','Bloom9'];

  var BLOOM_COLS =['#D06BA8','#EE7A3D','#3E86D6','#E4A62C','#9B5FD0','#C94DA6','#6A63DB','#B0568F'];
  var BLOOMS=null;
  function buildBlooms(){

  function bloomFor(name){ if(!BLOOMS) buildBlooms(); return BLOOMS[name] || {img:'assets/icons/Bloom1.png', col:'#D06BA8'}; }

  /* category detail — slide-up sheet with frosted header + mountain depth */
  var catSheet=null;
  // Build the swappable parts (accent + eyebrow + titlerow + body) for a woordgroep or the Moeilijk list
  function buildCatParts(name){
    var isHard = (name==='Moeilijk');
    var g, pairs;
    if(isHard){
      pairs=[];
      TERMEN.forEach(function(gr){ (gr.items||[]).forEach(function(it){ if(HARD[it.roman]) pairs.push({it:it, grp:gr.groep}); }); });
      g = {groep:name, items:pairs.map(function(x){ return x.it; })};
    } else {
      g = catByName(name); if(!g) return null;
      pairs = g.items.map(function(it){ return {it:it, grp:null}; });
    }
    var list = pairs.length
      ? pairs.map(function(x){ return termRowHtml(x.it, x.grp); }).join('')

    // zodra hij kwam of ging.
    var chips = '';

    var note = isHard
      ? 'Je moeilijke woorden staan hier bij elkaar — oefen ze tot ze vanzelf gaan.'
      : '';

      eyebrow:'낱말 · '+(isHard?'MOEILIJK':'WOORDGROEP'),

      chips:chips, note:note, list:list,

  function applyCatAccent(el, ac){

  function catNames(){ return TERMEN.filter(function(g){ return g.items && g.items.length>=2; }).map(function(g){ return g.groep; }); }
  function openCat(name){
    var parts = buildCatParts(name); if(!parts) return;

    if(multi){
      var citems = catNames().map(function(n){ return {id:n, label:n}; });

        step:function(dir){ navCat(dir); },

      '</div>'+
      '<div class="cs-body">'+parts.body+'</div>'+

  // Cross-slide only the woordgroep title, mirroring the belt-picker meta swap (old slides out, new in)
  function csTitleSwap(sheet, name, dir){
    if(!sheet) return;
    var wrap=sheet.querySelector('.cs-titlewrap');
    var cur=wrap && wrap.querySelector('.cs-title-cur');
    if(!cur) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ cur.innerHTML=name; return; }
    var stale=wrap.querySelectorAll('.cs-title-ghost');
    for(var i=0;i<stale.length;i++){ if(stale[i].parentNode) stale[i].parentNode.removeChild(stale[i]); }
    var ghost=cur.cloneNode(true);

    cur.classList.remove('enter-r','enter-l'); void cur.offsetWidth;
    cur.classList.add(dir<0 ? 'enter-l' : 'enter-r');

    var done=function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); };
    ghost.addEventListener('animationend', done);
    setTimeout(done, 520);

  // Apply a group's confidence state to its .cs-rate-opts (selection + group-specific bloom colour).
  function setRateOpts(optsEl, name){
    if(!optsEl) return;
    var s=catStage(name), b=bloomFor(name);
    var opts=optsEl.querySelectorAll('.cs-ropt');
    for(var i=0;i<opts.length;i++){
      var btn=opts[i], st=+btn.getAttribute('data-stage');
      btn.setAttribute('data-groep', name);
      btn.classList.toggle('on', st===s);
      if(st===2){ btn.style.setProperty('--ic', b.col); var gi=btn.querySelector('.gicon'); if(gi) gi.setAttribute('style', bloomStyle(b)); }
    }
  }
  // Paging: the three confidence icons + their highlight slide fully out/in as one set (a carousel)
  // while the "Hoe goed ken je…" label stays put. Ghost-clones the old set sliding out; the new set
  // snaps its highlight (so it rides in WITH the icons) and slides in. Same dir mapping as csTitleSwap.
  function csRateSwap(sheet, name, dir){
    if(!sheet) return;
    var rate=sheet.querySelector('.cs-rate'); if(!rate) return;
    var wrap=rate.querySelector('.cs-rate-optswrap'); if(!wrap) return;
    var opts=wrap.querySelector('.cs-rate-opts'); if(!opts) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      setRateOpts(opts, name); moveRateHL(rate, true); return;
    }
    var stale=wrap.querySelectorAll('.cs-rate-opts-ghost');
    for(var i=0;i<stale.length;i++){ if(stale[i].parentNode) stale[i].parentNode.removeChild(stale[i]); }
    var ghost=opts.cloneNode(true);
    ghost.className='cs-rate-opts cs-rate-opts-ghost';
    wrap.appendChild(ghost);
    setRateOpts(opts, name);
    moveRateHL(rate, true);
    opts.classList.remove('enter-r','enter-l'); void opts.offsetWidth;
    opts.classList.add(dir<0 ? 'enter-l' : 'enter-r');
    ghost.classList.add(dir<0 ? 'exit-r' : 'exit-l');
    var done=function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); };
    ghost.addEventListener('animationend', done);
    setTimeout(done, 520);

  // Slide the confidence-selector highlight to the active option (tween like the tab bar); snap on first paint.
  function moveRateHL(rate, snap){
    if(!rate) return;
    var opts=rate.querySelector('.cs-rate-opts'); if(!opts) return;
    var hl=opts.querySelector('.cs-rate-hl'); if(!hl) return;
    var on=opts.querySelector('.cs-ropt.on'); if(!on){ hl.classList.remove('ready'); return; }
    var ic=(on.style.getPropertyValue('--ic')||'').trim();
    if(snap) hl.style.transition='none';
    if(ic) hl.style.setProperty('--hlic', ic);
    hl.style.width=on.offsetWidth+'px';
    hl.style.transform='translateX('+on.offsetLeft+'px)';
    hl.classList.add('ready');
    if(snap){ void hl.offsetWidth; hl.style.transition=''; }  // restore CSS tween for later moves
  }
  // Note stays in place; its text crossfades (out → swap → in).
  function fadeSwap(el, html){
    if(!el) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.innerHTML=html; return; }
    el.classList.add('cs-fading');
    setTimeout(function(){ el.innerHTML=html; el.scrollTop=0; el.classList.remove('cs-fading'); }, 170);
  }
  // The list card FRAME (bg/border) stays fixed. Old rows fade out, new rows fade in, and the
  // card height eases from the old to the new group's height when the row count differs.
  function swapCatList(el, html, dir){
    if(!el) return;
    var body = el.closest('.cs-body');
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      el.innerHTML=html; if(body) body.scrollTop=0; return;
    }
    if(body) body.scrollTop=0;   // een nieuwe woordgroep begint bovenaan, niet halverwege
    var out = dir<0 ? 'cs-out-r' : 'cs-out-l', into = dir<0 ? 'cs-in-l' : 'cs-in-r';
    el.classList.remove('cs-in-l','cs-in-r');
    el.classList.add('cs-fading', out);             // current rows slide out of the way
    setTimeout(function(){
      el.classList.remove(out);
      el.innerHTML = html;                          // swap while faded
      /* De lijst neemt meteen de hoogte van zijn nieuwe inhoud. Eerder werd daar in .3s naartoe
         geanimeerd, maar sinds het hele blad rolt schuift die ease de rijen onder je vinger
         vandaan terwijl je al begint te lezen — en bij een groot lengteverschil deint de
         pagina zichtbaar na. Alleen de rijen kruisen nog; de hoogte volgt in één keer. */
      requestAnimationFrame(function(){ el.classList.remove('cs-fading'); el.classList.add(into); });
      setTimeout(function(){
        el.classList.remove(into);
        if(body) csEdgeFade(body);
      }, 400);
    }, 170);
  }
  /* ---- Shared bottom dot navigation (Woorden woordgroepen + Handboek onderdelen) ----
     activePager holds the paging model for the sheet currently on screen. */
  var activePager = null;   // { sheet, items:[{id,label}], step(dir), pick(id) }
  function buildDotsHtml(items, activeId, stateFor){
    if(!items || items.length<2) return '';
    var h='<div class="cs-dots">';
    for(var i=0;i<items.length;i++){
      var st = stateFor ? stateFor(items[i].id) : null;
      h+='<button class="cs-dot'+(items[i].id===activeId?' on':'')+(st?(' '+st.cls):'')+'"'+
         ' data-act="dotgoto" data-id="'+esc(items[i].id)+'"'+
         ' aria-label="'+esc(items[i].label)+(st?(', '+st.hint):'')+'"></button>';
    }
    return h+'</div>';
  }
  /* Wat een puntje over zijn woordgroep verklapt. Een vinkje betekent: hier ben je klaar. Een
     stip betekent dus dat er nog iets te doen is, en dat is precies wat je wilt zien als je
     zoekt waar je heen moet. */
  function catDotState(name){
    var g=catByName(name); if(!g) return null;
    // Een groep met bladwijzers vraagt aandacht, ook als je hem op "ken ik" hebt gezet: die
    // woorden heb je zelf apart gelegd. Zo'n groep houdt dus zijn stip.
    if(catHard(g).length) return {cls:'st-todo', hint:'moeilijke woorden'};
    if(catRated(name) && catStage(name)<2) return {cls:'st-todo', hint:'nog oefenen'};
    if(catStage(name)>=2) return {cls:'st-done', hint:'ken je al'};
    return null;
  }
  // Na het markeren van een woord of het kiezen van een niveau klopt de staat van het
  // huidige puntje niet meer; alleen dat ene puntje hoeft bijgewerkt.
  function refreshCatDot(name){
    if(!catSheet) return;
    var dot=catSheet.querySelector('.cs-dot[data-id="'+(window.CSS&&CSS.escape?CSS.escape(name):name)+'"]');
    if(!dot) return;
    var st=catDotState(name), base=dot.getAttribute('aria-label').split(',')[0];
    dot.classList.remove('st-todo','st-done');
    if(st) dot.classList.add(st.cls);
    dot.setAttribute('aria-label', base+(st?(', '+st.hint):''));
  }
  function pagerDots(){ return activePager ? activePager.sheet.querySelector('.cs-dots') : null; }
  // De puntjes staan vast in beeld: ze vertellen waar je bent, en dat is ook waar als je
  // even niets doet. Vroeger doofden ze na 1,7 seconde, waardoor je bij elke veeg opnieuw
  // moest zoeken hoeveel woordgroepen er eigenlijk zijn.
  function showDots(){}
  function updateDots(activeId){
    var dots=pagerDots(); if(!dots || !activePager) return;
    var btns=dots.querySelectorAll('.cs-dot'), items=activePager.items;
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', !!(items[i] && items[i].id===activeId)); }
    showDots();
  }
  // Aan de puntjesbalk valt niet te slepen: je tikt een puntje aan en je springt erheen.
  // De sleepbediening (puntjes groeien, zwevend label van het doel) was een tweede manier
  // om hetzelfde te doen en ging in de weg zitten bij het gewone vegen.
  function attachDotScrub(sheet){
    var dots=sheet.querySelector('.cs-dots'); if(!dots) return;
    // Een sleep die op de puntjes begint doet niets — hij mag ook niet als paginaveeg tellen.
    dots.addEventListener('pointerdown', function(e){ e.stopPropagation(); });

  // Swap the Woorden sheet to another woordgroep (dir sets the cross-slide direction).
  // Only the title moves (cross-slide); the rate card + note + list stay fixed and their content crossfades.
  function swapToCat(name, dir){
    if(!catSheet) return;
    var parts = buildCatParts(name); if(!parts) return;
    applyCatAccent(catSheet, parts.accent);
    catSheet.setAttribute('data-cat', name);
    var eye=catSheet.querySelector('.cs-eye'); if(eye) eye.innerHTML=parts.eyebrow;
    var chips=catSheet.querySelector('.cs-titlerow .cs-chips'); if(chips) chips.innerHTML=parts.chips;
    csTitleSwap(catSheet, esc(name), dir);
    csRateSwap(catSheet, name, dir);

    swapCatList(catSheet.querySelector('.ct-list'), parts.list, dir);

  // Page between woordgroepen in place (dir -1 prev / +1 next); skips the Moeilijk list.
  // Bewust geen lus: voorbij de laatste woordgroep gebeurt er niets. Zo voel je waar de reeks
  // ophoudt in plaats van onverwacht weer bij de eerste uit te komen.
  function navCat(dir){
    if(!catSheet) return;
    var cur = catSheet.getAttribute('data-cat');
    var names = catNames();
    var i = names.indexOf(cur); if(i<0 || names.length<2) return;

  // Aan het begin of het eind veert het scherm kort terug, zodat de veeg wel antwoord geeft.

  /* Een kaart sluit je met "Klaar" of door ernaast te tikken; een veeg omlaag hoort daar

     kunt bedenken dat je hem toch wilt houden. Laat je ver genoeg los, dan sluit hij via
     precies dezelfde weg als tikken naast de kaart — zo houdt elk sheet zijn eigen

  (function(){
    var card=null, ov=null, x0=0, y0=0, dy=0, h=1, down=false, drag=false, pid=null;

    function paint(){
      card.style.transform = dy ? 'translateY('+dy+'px)' : '';

      if(card){ card.style.transition=''; card.style.transform=''; }

      swallow=false;

      var t=e.target; if(!t || !t.closest) return;
      var c=t.closest('.beltsheet-ov.show .beltsheet'); if(!c) return;
      if(t.closest(GRIP_SKIP)) return;            // knoppen, velden en de schuif houden hun eigen gebaar
      card=c; ov=c.closest('.beltsheet-ov');

    document.addEventListener('pointermove', function(e){
      if(!down || e.pointerId!==pid) return;

  var VSB_SEL='.surface,.sbody,.cs-body,.wscroll';
  /* De vervaging boven- en onderaan een rollend gebied zegt dat er nog meer staat. Hij hangt
     aan twee plakkertjes in de scroller zelf; die blijven aan de rand van het kijkvenster
     plakken, dus hij schuift niet mee met de inhoud. Een scroller krijgt ze pas als hij ze
     nodig heeft — csFades zet ze erin zodra er een blad opengaat. */
  function csFades(c){
    if(!c) return;
    // De inhoud van een blad wordt soms in zijn geheel vervangen; dan zijn de plakkertjes weg
    // en moeten ze er opnieuw in. We kijken dus of ze er staan, niet of we ze ooit zetten.
    var up=c.querySelector(':scope > .cs-fade.up'), dn=c.querySelector(':scope > .cs-fade.dn');
    if(!up){ up=document.createElement('i'); up.className='cs-fade up'; c.insertBefore(up, c.firstChild); }
    if(!dn){ dn=document.createElement('i'); dn.className='cs-fade dn'; c.appendChild(dn); }
    // Een plakkertje blijft uit zichzelf bij de rand van de inhoud hangen, dus binnen de
    // binnenmarge van het blad. Dan bleef er bovenaan een strookje over waar de inhoud
    // onvervaagd langs schoof. We trekken ze daarom met de eigen marge van het blad mee naar
    // de echte rand — uitgerekend in plaats van ingetypt, zodat het klopt bij elk blad.
    var cs=getComputedStyle(c);
    up.style.top='-'+cs.paddingTop;
    dn.style.bottom='-'+cs.paddingBottom;
    up.style.marginLeft=dn.style.marginLeft='-'+cs.paddingLeft;
    up.style.marginRight=dn.style.marginRight='-'+cs.paddingRight;
  }
  function csEdgeFade(c){
    if(!c) return;

    c.classList.toggle('more-down', ruimte>2 && c.scrollTop < ruimte-2);
  }
  // Bij het openen of wisselen van een woordgroep is er nog niet gescrold, dus moeten de
  // vervagingen alvast kloppen voordat de gebruiker iets doet.
  function csEdgeFadeAll(root){

  /* Transient overlay scrollbar: a JS thumb (.vsb) per scroll container, shown while scrolling then faded. */
  (function(){

      var t=c._vsb;
      if(!t || t.parentNode!==c){
        if(getComputedStyle(c).position==='static') c.style.position='relative';
        if(!t){ t=document.createElement('div'); t.className='vsb'; c._vsb=t; }
        c.appendChild(t);
      }
      return t;
    }
    function update(c){
      csEdgeFade(c);
      var sh=c.scrollHeight, ch=c.clientHeight;
      if(sh-ch<=6){ if(c._vsb) c._vsb.classList.remove('on'); return; }
      var t=thumbFor(c);
      var th=Math.max(28, Math.round(ch*ch/sh)), travel=ch-th;
      var y=(c.scrollTop/(sh-ch))*travel;

      clearTimeout(c._vsbHide);
      c._vsbHide=setTimeout(function(){ if(c._vsb) c._vsb.classList.remove('on'); }, 950);

      var c=e.target;

  var HB_MASC={

  function toggleExamChk(id){
    if(!id) return;

    examSave();
    buzz(nowOn?12:6);
    sfx(nowOn?'check':'uncheck');                       // same scratch as the Vandaag day-card
    if(hbSheet){
      var body=hbSheet.querySelector('.cs-body');
      if(body){
        // De balk heeft een transitie, maar de kaart wordt in zijn geheel opnieuw opgebouwd en
        // een vers element heeft geen vorige breedte om vanaf te lopen. Dus zetten we hem eerst
        // terug op de oude stand en pas in het volgende beeldje op de nieuwe; dan groeit hij mee
        // met het vinkje in plaats van er meteen te staan.
        var vorigeBreedte=(function(){ var i=body.querySelector('.hb-prog-bar i'); return i?i.style.width:''; })();
        body.innerHTML=hbBody('examen');
        var balk=body.querySelector('.hb-prog-bar i');

          var doel=balk.style.width;

          });

          if(row) row.classList.add('just');

      }
    }

  function hbBody(key){
    var cat=hbCat(key);

    if(key==='ilbo'||key==='hosinsul') return hbNaslagBody(key);

      (C.technieken||[]).forEach(function(gr){
        h+='<div class="hb-grouphd">'+esc(gr.cat)+'</div>';

  var hbSheet=null;

  // Page between Handboek onderdelen in place (dir -1 prev / +1 next), cycling; body crossfades, title cross-slides.
  function swapToHb(key, dir){

  /* Zet de meekrimpende mascotte op voor de sectie die nu in het blad staat. Draait bij het
     openen én bij elke wissel, want anders bleef de tekening van de vorige sectie in de kop
     hangen terwijl de lijst eronder al iets anders was. Secties zonder tekening ruimen alles
     netjes op en zetten --pmc terug op 0. */
  function mascSetup(sheet){
    var body=sheet.querySelector('.cs-body');
    var oud=sheet.querySelector('.pm-masc'); if(oud&&oud.parentNode) oud.parentNode.removeChild(oud);
    if(body&&body._pmScroll){ body.removeEventListener('scroll', body._pmScroll); body._pmScroll=null; }
    if(sheet._pmResize){ window.removeEventListener('resize', sheet._pmResize); sheet._pmResize=null; }
    sheet.style.setProperty('--pmc','0');
    var m=HB_MASC[sheet.getAttribute('data-hb')];
    sheet.classList.toggle('has-masc', !!m);
    if(!m) return;
    var hero=sheet.querySelector('.cs-hero'), title=sheet.querySelector('.cs-title'),
        spacer=sheet.querySelector('#pm-spacer');
    if(!hero||!body||!title||!spacer) return;
    var masc=document.createElement('div');
    masc.className='pm-masc'; masc.id='pm-masc'; masc.setAttribute('aria-hidden','true');
    masc.innerHTML='<div class="pm-mascb">'+mascImgs(m.slug, m.delay, m.pair)+'</div>';
    hero.appendChild(masc);
    var beeld=masc.querySelector('img'), wh=m.wh;   // breedte gedeeld door hoogte
    function geom(){
      // Zodra de tekening geladen is weten we de echte verhouding; tot die tijd staat er een
      // opgegeven waarde, zodat de ruimte meteen klopt en de lijst niet naspringt.
      if(beeld&&beeld.naturalWidth) wh=beeld.naturalWidth/beeld.naturalHeight;
      var hr=hero.getBoundingClientRect(), tr=title.getBoundingClientRect(),
          br=body.getBoundingClientRect();
      if(!hr.width) return;
      var restW=Math.max(120, Math.min(m.restMax, hr.width*m.rest));
      var restH=restW/wh;
      var x0=Math.round((hr.width-restW)/2);          // rust: gecentreerd onder de titel
      var y0=Math.round((tr.bottom-hr.top)+12);
      // Gedokt past de tekening in een vast doosje. Een staande mascotte loopt tegen de hoogte
      // aan, een liggende scène tegen de breedte; op één maat sturen maakte de scènes zo breed
      // dat ze de titel uit beeld drukten.
      var dockH=74, dockW=Math.min(88, dockH*wh);
      dockH=dockW/wh;
      var s=dockW/restW;
      // Dok naast de TEKST van de titel (het .cs-title-vak is zo breed als de pagina), en houd
      // hem binnen de kop.
      var textRight=tr.right;
      try{ var rg=document.createRange(); rg.selectNodeContents(title); var rr=rg.getBoundingClientRect(); if(rr.width) textRight=rr.right; }catch(e){}
      var dockX=Math.round((textRight-hr.left)+16);
      var maxX=Math.round(hr.width-dockW-10);
      if(dockX>maxX) dockX=maxX;
      var dockTop=Math.round((tr.bottom-hr.top)-dockH+4);
      masc.style.setProperty('--pm-w', restW+'px');
      masc.style.setProperty('--pm-x0', x0+'px');
      masc.style.setProperty('--pm-y0', y0+'px');
      masc.style.setProperty('--pm-dx', (dockX-x0)+'px');
      masc.style.setProperty('--pm-dy', (dockTop-y0)+'px');

      // Reserveer de rusthoogte zodat de lijst er net onder begint; diezelfde afstand is het
      // rolbereik waarover het dokken afrondt, zodat het reserveblok precies leeg is als hij
      // op zijn plek staat.
      var Hs=Math.max(40, Math.round((hr.top+y0+restH) - br.top + 14));
      spacer.style.height=Hs+'px';
      // Het gebaar rondt af over die hele hoogte, zodat het reserveblok precies leeg is als de
      // mascotte op zijn plek staat. Daar is wel voor nodig dat de pagina zo ver kán rollen.
      // Gyeorugi en Gyeokpa hebben te weinig tekst en kwamen zo'n 150px tekort: het reserveblok
      // bleef half in beeld staan als een gat tussen de gedokte mascotte en de eerste regel, en
      // het dokken haastte zich door die paar pixels heen. Dat tekort leggen we er onderaan bij.
      // Eerst onze eigen lucht weghalen, anders meten we de vorige meting mee.
      if(body._pmPad0==null) body._pmPad0=getComputedStyle(body).paddingBottom;
      body.style.paddingBottom=body._pmPad0;
      var tekort=Math.max(0, body.clientHeight - (body.scrollHeight - Hs));

      body._pmHs=Hs;
    }
    function upd(){ var Hs=body._pmHs||1, c=body.scrollTop/Hs; c=c<0?0:c>1?1:c; sheet.style.setProperty('--pmc', c.toFixed(3)); }
    function beslis(){ geom(); upd(); }
    beslis();
    body._pmScroll=upd;
    body.addEventListener('scroll', upd, {passive:true});
    sheet._pmResize=beslis; window.addEventListener('resize', sheet._pmResize);

    if(beeld&&!beeld.complete) beeld.addEventListener('load', beslis, {once:true});
    setTimeout(beslis, 70);

  // lighten(+)/darken(-) a #rrggbb hex by pct toward white/black
  function shade(hex, pct){
    var h=hex.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    var t=pct<0?0:255, p=Math.abs(pct)/100;
    function mix(c){ return Math.round((t-c)*p+c); }
    function hx(c){ return ('0'+c.toString(16)).slice(-2); }
    return '#'+hx(mix(r))+hx(mix(g))+hx(mix(b));
  }

  // 'Klaar' pas vrij als je de hele lijst hebt doorlopen (of als de lijst niet scrollbaar is, bv. korte spar-drill).
  // Daarnaast: de overlay-titel dokt mee met de scroll (zelfde principe als de check-in swipe).
  function drillInit(){
    if(!drillEl) return;
    WDECK=null;
    var body=drillEl.querySelector('#drill-body'), doneBtn=drillEl.querySelector('#drill-done'),
        head=drillEl.querySelector('#drill-head'), shead=drillEl.querySelector('.shead'),
        inEl=body&&body.querySelector('.dr-in');

    if(body._drDock) body.removeEventListener('scroll', body._drDock);
    body._drDock=dockUpd; body.addEventListener('scroll', dockUpd, {passive:true}); dockUpd();

      }

    gate();

  // Woorden-deck (Kaarten-tab): bladerbare flip-kaarten naast de lijst.
  function wdSetup(body, doneBtn){
    var root = body && body.querySelector('.wd-kaarten'); if(!root){ WDECK=null; return; }
    WDECK = { root:root, terms:(vocabOfDay().terms||[]), idx:0, done:doneBtn, swiped:false };
    var taps = root.querySelectorAll('.tap');
    for(var ti=0; ti<taps.length; ti++){ var tp=taps[ti];
      if(!tp._wdGlint){ tp._wdGlint=true; tp.addEventListener('animationend', function(){ this.classList.remove('glint'); }); }
    }
    // listen-pill nudge cleanup (deck back)
    var lb = root.querySelector('.wf-listen');
    if(lb && !lb._wdNudge){ lb._wdNudge=true; lb.addEventListener('animationend', function(){ this.classList.remove('nudge'); }); }
    var deck = root.querySelector('.wdeck');
    var card = root.querySelector('#wd-flip');
    if(deck && card && !card._wdSwipe){
      card._wdSwipe=true; card.style.touchAction='pan-y'; deck.style.touchAction='pan-y';
      var sx=0, sy=0, dn=false, drag=false, W=300, pid=null;
      var springIn='transform .26s cubic-bezier(.32,.72,0,1),opacity .26s ease';
      function relax(anim){ card.style.transition = anim ? springIn : 'none'; card.style.transform=''; card.style.opacity=''; }
      function atStart(){ return WDECK && WDECK.idx===0; }
      function atLast(){ return WDECK && WDECK.idx===WDECK.terms.length-1; }
      deck.addEventListener('pointerdown', function(e){
        if(e.target.closest && e.target.closest('.wf-listen,.wdeck-dots')){ dn=false; return; }
        dn=true; drag=false; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
        W=card.offsetWidth||300; if(WDECK) WDECK.swiped=false; card.style.transition='none';
      });
      deck.addEventListener('pointermove', function(e){
        if(!dn) return;
        var dx=e.clientX-sx, dy=e.clientY-sy;
        if(!drag){
          if(Math.abs(dx)<8) return;
          if(Math.abs(dx)<=Math.abs(dy)){ dn=false; return; }   // vertical intent → let it scroll
          drag=true; try{ deck.setPointerCapture(pid); }catch(_){}
        }
        var atEnd=(dx>0&&atStart())||(dx<0&&atLast());
        var eff=atEnd?dx*0.3:dx;                                 // rubber-band resistance at the ends
        card.style.transform='translateX('+eff+'px) rotate('+(eff*0.018)+'deg)';
        card.style.opacity=String(Math.max(.5,1-Math.abs(eff)/(W*1.5)));
      });
      function end(e){
        if(!dn) return; dn=false;
        try{ if(pid!=null) deck.releasePointerCapture(pid); }catch(_){}
        if(!drag){ relax(false); return; }                      // pure tap → leave the flip-click alone
        if(WDECK) WDECK.swiped=true;                             // any real drag suppresses the ensuing flip
        var dx=(e.clientX||sx)-sx;
        var go = Math.abs(dx)>Math.min(72,W*0.22) && !((dx>0&&atStart())||(dx<0&&atLast()));
        if(go && WDECK){
          var dir = dx<0 ? 1 : -1;                               // left-swipe → next, right-swipe → prev
          card.style.transition='transform .17s ease,opacity .17s ease';
          card.style.transform='translateX('+(dir<0?W:-W)+'px)'; card.style.opacity='0';
          setTimeout(function(){
            wdShow(WDECK.idx+dir);
            card.style.transition='none';
            card.style.transform='translateX('+(dir<0?-W:W)+'px)'; card.style.opacity='0';
            void card.offsetWidth;                              // start off-screen on the opposite side, then glide in
            card.style.transition=springIn; card.style.transform=''; card.style.opacity='';
          },145);
        } else { relax(true); }                                 // not far enough → spring back
      }
      deck.addEventListener('pointerup', end);
      deck.addEventListener('pointercancel', function(){ if(dn){ dn=false; try{ if(pid!=null) deck.releasePointerCapture(pid); }catch(_){} relax(true); } });
    }
    wdShow(0);
  }
  function wdGlint(back){
    if(!WDECK) return;
    if(back){                                                    // back face → nudge the labelled listen pill
      var b=WDECK.root.querySelector('.face.back .wf-listen'); if(!b) return;
      b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge');
    } else {                                                     // front face → glint the flip-hint
      var t=WDECK.root.querySelector('.face.front .tap'); if(!t) return;
      t.classList.remove('glint'); void t.offsetWidth; t.classList.add('glint');
    }
  }
  function wdShow(i){
    if(!WDECK) return;

  var examEl = null, examState = null;
  function examBank(){
    var src = (window.POOM_VRAGEN && window.POOM_VRAGEN.vragen) || [];
    var out = [];
    src.forEach(function(q){
      if(q.niveau==='poom2' && POOM!=='2') return;        // Koryo-theorie pas vanaf 2e poom
      var opts = (q.opties||[]).slice();
      var ai = opts.indexOf(q.antwoord);
      if(opts.length<2 || ai<0){                          // ongeldige vraag → melden + overslaan
        if(window.console) console.warn('[examen] vraag overgeslagen (antwoord niet in opties):', q.id); return; }
      out.push({ v:q.vraag, o:opts, a:ai, cat:q.categorie||'', why:q.toelichting||'', term:q.term||'' });
    });
    return out;

  function examShuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;

  function openExam(){
    if(examEl) return;

    // Prioritise questions tied to a bookmarked (moeilijk) term so the proefexamen tests what the
    // student marked as hard — then fill the rest and shuffle the final set for a natural order.
    var sh = examShuffle(bank);
    var hot = sh.filter(function(q){ return q.term && HARD[q.term]; });
    var rest = sh.filter(function(q){ return !(q.term && HARD[q.term]); });
    var qs = examShuffle(hot.concat(rest).slice(0, n));
    examState = { qs:qs, i:0, goed:0, fout:0, total:n, maxFout:rule.fout, pass:Math.max(1, n-rule.fout), answered:false };

  // Tint the iOS top bar to match the current screen. The Vandaag/handboek
  // screens are cream (--page); the Oefentimer is its element-coloured gradient, so
  // we point the theme-color at that gradient's top (--el) while the timer is open.
  // Safari volgt theme-color live, maar een geïnstalleerde PWA doet dat niet: die kleurt de
  // statusbalk met de achtergrond van het document. De timer is een laag *boven* de body, dus
  // zonder --topbar bleef de balk crème terwijl het scherm blauw was.
  function setTopBar(color){
    var c=String(color||getComputedStyle(document.documentElement).getPropertyValue('--page')||'#F4F1EA').trim();
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', c);
    document.documentElement.classList.toggle('tint', !!color);
    if(color) document.documentElement.style.setProperty('--topbar', c);
    else document.documentElement.style.removeProperty('--topbar');

  // De dim-laag van een kaartje ligt binnen het toestelframe en komt dus niet tot in de
  // statusbalk. Deze schakelaar dimt de aflees-strook mee, zodat de verduistering doorloopt
  // tot bovenaan het scherm. We tellen de open kaartjes uit de DOM, zodat gestapelde
  // kaartjes (bijvoorbeeld het menu boven de filmpjeslijst) vanzelf goed gaan.
  //
  // De strook mag geen CSS-overgang hebben: zolang er een transitie loopt, leest iOS de
  // kleur van de statusbalk niet opnieuw af. Zonder overgang sprong hij echter in één klap
  // op zwart terwijl de sluier eronder nog rustig indonkerde. Daarom rekenen we de overgang
  // hier zelf uit: dezelfde duur en dezelfde curve als .beltsheet-ov, maar als gewone
  // stijlwijziging per frame in plaats van als transitie.
  var DIM_MS=280, DIM_MAX=.58;
  // De standaardcurve 'ease' van CSS is cubic-bezier(.25,.1,.25,1); die zoeken we per frame op.
  function dimEase(t){
    function bz(a,b,u){ var v=1-u; return 3*v*v*u*a + 3*v*u*u*b + u*u*u; }
    var lo=0, hi=1, m=0;
    for(var i=0;i<18;i++){ m=(lo+hi)/2; if(bz(.25,.25,m)<t) lo=m; else hi=m; }
    return bz(.1,1,(lo+hi)/2);
  }
  var dimRaf=0, dimNu=0, dimDoel=0, dimVan=0, dimT0=0;
  function dimTeken(a){
    var d=document.getElementById('topdim'), f=document.getElementById('topfade');
    if(d) d.style.backgroundColor='rgba(16,20,26,'+a.toFixed(3)+')';
    // Het verloop onder de strook dooft mee; anders blijft er een lichte band boven de dim.
    if(f) f.style.opacity = a>0 ? String(Math.max(0, 1-a/DIM_MAX)) : '';
  }
  function dimStap(){
    var p=Math.min(1,(performance.now()-dimT0)/DIM_MS);
    dimNu = dimVan + (dimDoel-dimVan)*dimEase(p);
    dimTeken(dimNu);
    if(p<1){ dimRaf=requestAnimationFrame(dimStap); return; }
    dimRaf=0; dimNu=dimDoel; dimTeken(dimNu);
    // Pas als de strook helemaal terug is mag de klasse eraf, anders klapt hij alsnog weg.
    if(!dimDoel){ document.documentElement.classList.remove('dimmed'); dimTeken(0); }
  }
  function syncTopDim(){
    var aan = !!document.querySelector('.beltsheet-ov.show');
    var doel = aan ? DIM_MAX : 0;
    if(doel===dimDoel && !dimRaf) return;
    dimDoel=doel; dimVan=dimNu; dimT0=performance.now();
    // Eerst de huidige stand vastzetten en pas daarna tonen: anders staat de strook één
    // frame lang op de waarde uit het stijlblad en zie je precies de sprong die we wegwerken.
    dimTeken(dimNu);
    if(aan) document.documentElement.classList.add('dimmed');
    var stil = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* De moduskiezer werkt als een schuifknop: je kunt de witte schijf ook naar de andere

  function attachModeSwipe(el){
    var menu=el.querySelector('.ot-mmenu'); if(!menu) return;
    var x0=0, down=false, used=false;
    menu.addEventListener('pointerdown', function(e){
      if(e.pointerType==='mouse' && e.button!==0) return;
      x0=e.clientX; down=true; used=false;
    });
    menu.addEventListener('pointermove', function(e){
      if(!down || used) return;
      var dx=e.clientX-x0;
      if(Math.abs(dx)<26) return;                 // korte trilling is geen veeg
      down=false; used=true;
      var m = dx>0 ? 'time' : 'count';            // naar rechts is de tweede keuze
      if(m!==otState.mode) otPickMode(m);
    });
    menu.addEventListener('pointerup', function(){ down=false; });
    menu.addEventListener('pointercancel', function(){ down=false; used=false; });
    // Na een veeg landt de vinger op een optie; die tik mag niet alsnog iets omzetten.
    menu.addEventListener('click', function(e){
      if(used){ e.stopPropagation(); e.preventDefault(); used=false; }
    }, true);
  }
  function attachTimerSwipe(el){
    var x0=0,y0=0,down=false,swiped=false;
    el.addEventListener('pointerdown', function(e){
      down=false; swiped=false;
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(e.target && e.target.closest && e.target.closest('.ot-bar,.shead')) return;
      if(otState.mode==='time' && (otState.phase==='idle'||otState.phase==='done')){
        var d=el.querySelector('.pt-dial');
        if(d){
          var r=d.getBoundingClientRect();
          if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom) return;
        }
      }
      x0=e.clientX; y0=e.clientY; down=true;
    });
    el.addEventListener('pointermove', function(e){
      if(!down || swiped) return;
      var dx=e.clientX-x0, dy=e.clientY-y0;
      if(Math.abs(dx)<=Math.abs(dy)*1.4) return;      // verticaal gebaar — laat los
      if(dx>60){ swiped=true; down=false; closeTimer(); }
      else if(dx<-40){ down=false; }                  // naar links doet niets
    });
    el.addEventListener('pointerup', function(){ down=false; });
    el.addEventListener('pointercancel', function(){ down=false; });
    el.addEventListener('click', function(e){
      if(swiped){ e.stopPropagation(); e.preventDefault(); swiped=false; }

    var host=timerScreen; if(!host) return function(){};
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return function(){};
    var stapel=host.querySelector('.ot-left'), kiezer=host.querySelector('.ot-mode');
    if(!stapel||!kiezer) return function(){};
    var sr=stapel.getBoundingClientRect(), kr=kiezer.getBoundingClientRect();
    var oud=OT_MODE_KNOPPEN[vanaf]||[], nieuw=OT_MODE_KNOPPEN[naar]||[];
    oud.filter(function(sel){ return nieuw.indexOf(sel)<0; }).forEach(function(sel){

    });

      nieuw.filter(function(sel){ return oud.indexOf(sel)<0; }).forEach(function(sel){

  /* ---- De zandloper op de moduskiezer loopt mee met de aftelling ----
     Het bovenste zand loopt leeg richting de hals, het onderste groeit vanaf de bodem. Beide
     vormen zijn elkaars spiegelbeeld, dus na een halve slag neemt de een de rol van de ander
     over; welke van de twee bovenin staat hangt af van de stand van het glas. */
  var otZandF=0;   // hoeveel zand er in de bovenste kamer zit; in rust is het glas uitgelopen
  var HG_HALS={'hg-top':10.5, 'hg-bot':13.5}, HG_VLOER={'hg-top':4.4, 'hg-bot':19.6};
  var HG_MAX=0.82;   // vol is niet tot de nok: er blijft lucht onder het deksel, net als in een echt glas
  function otZandloper(frac){
    if(typeof frac==='number') otZandF=Math.max(0, Math.min(1, frac));
    var host=timerScreen; if(!host) return;
    var glas=host.querySelector('.ot-mode-fab .ot-mhour'); if(!glas) return;
    var om=glas.classList.contains('om');
    var boven=om?'hg-bot':'hg-top', onder=om?'hg-top':'hg-bot';
    // De vorm die bovenin hangt krimpt naar zijn eigen hals toe; de vorm onderin groeit
    // vanaf zijn eigen bodem. Beide houden daarbij de kegelvorm van het glas.
    zet(boven, HG_HALS[boven], otZandF);
    zet(onder, HG_VLOER[onder], 1-otZandF);
    function zet(klas, oy, s){
      var el=glas.querySelector('.'+klas); if(!el) return;
      s=Math.max(0.001, Math.min(1, s)*HG_MAX);   // nul geeft een matrix die niet te keren is
      el.setAttribute('transform','translate(12 '+oy+') scale('+s.toFixed(3)+') translate(-12 -'+oy+')');
      plas(glas.querySelector('.'+klas+'-p'), s, om);
    }
    /* Legt het glas zich op zijn kant, dan zoekt hetzelfde zand een nieuw evenwicht: het zakt
       naar de onderste wand en zijn oppervlak komt waterpas te liggen. Er gaat geen korrel bij
       of af, dus we zoeken de snijlijn waarbij het liggende vlak even groot is als het staande
       hoopje. De kamer loopt taps toe, dus dat vlak groeit met het kwadraat van de breedte —
       vandaar de wortel. r loopt van 0 (leeg) tot 2 (de hele kamer vol).
       Het glas kantelt naar links of naar rechts, en dat bepaalt welke kant nu beneden is. */
    function plas(el, s, om){
      if(!el) return;
      var deel=s*s;                                                     // het hoopje is de kamer, s keer verkleind
      var r=deel<=0.5 ? Math.sqrt(2*deel) : 2-Math.sqrt(2*(1-deel));
      var pct=((1-r/2)*100).toFixed(1);
      el.style.clipPath = om ? 'inset(0 '+pct+'% 0 0)' : 'inset(0 0 0 '+pct+'%)';
    }
  }

  function otSyncTime(){

  function otRenderTime(opts){
    var host=timerScreen; if(!host) return;

        hint=host.querySelector('#ot-hint'), dial=host.querySelector('.ptimer');

    var ready=(otState.phase==='ready');

    // De uitleg hoort in de ring, net als bij Tellen; buiten de ring blijft alleen de extra tip.
    // Loopt de tijd, dan staat er een klein pauzeteken onder de cijfers: zonder dat zag je

    if(hint){
      hint.classList.remove('glint');
      if(running && otState.running){ hint.textContent=''; hint.style.opacity='0'; }
      else if(running){ hint.textContent='gepauzeerd — tik om verder te gaan'; hint.style.opacity='1'; }
      else if(done){ hint.textContent='klaar! · tik voor opnieuw'; hint.style.opacity='1'; }

    host.classList.add('running'); buzz(16); otSyncTime(); otSyncDur();

    otRenderTime({noTrans:true});
    host.classList.remove('running');

  function otPauseTime(){

  function otResumeTime(){

  var blinkTO=null;

  function blinkOnce(el, dbl){
    el.classList.add('blink');
    setTimeout(function(){ el.classList.remove('blink');
      if(dbl){ setTimeout(function(){ el.classList.add('blink');
        setTimeout(function(){ el.classList.remove('blink'); }, 105); }, 115); }
    }, 105);
  }
  function scheduleBlink(){
    stopBlink();
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function next(delay){
      blinkTO=setTimeout(function(){
        var el=stage.querySelector('.greet-masc .gm-b');
        if(!el){ stopBlink(); return; }
        blinkOnce(el, Math.random()<0.24);
        next(2600+Math.random()*3800);
      }, delay);
    }
    next(1500+Math.random()*1600);
  }

    var el=stage.querySelector('.greet-masc .gm-b');
