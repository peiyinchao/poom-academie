  .ux-swipe .qc-count{display:inline-block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;
    font-size:11px;color:var(--gray);font-weight:700;margin-bottom:12px}
  /* reflect: coiled belt lying between the title and the question cards (rotated 90deg CCW -> label on the right) */
  .ci-beltband{flex:none;position:relative;z-index:1;height:118px;pointer-events:none}
  .bb-belt{position:absolute;left:157px;top:50%;width:99px;height:270px;transform:translate(-50%,-50%) rotate(-90deg)}
  .bb-belt .cb{position:absolute;inset:0}
  .bb-belt .cb-main{background:var(--belt-main,#2F3030);
    -webkit-mask:url(assets/img/reflect-belt-main.png) no-repeat center/contain;
    mask:url(assets/img/reflect-belt-main.png) no-repeat center/contain}
  .bb-belt .cb-dark{background:var(--belt-dark,#202121);
    -webkit-mask:url(assets/img/reflect-belt-dark.png) no-repeat center/contain;
    mask:url(assets/img/reflect-belt-dark.png) no-repeat center/contain}
  .bb-belt .cb-ink{background:url(assets/img/reflect-belt-ink.png) no-repeat center/contain}

  /* Begeleide drill (woorden/sparring): vaste kop (kicker + titel + telling + uitleg) die NIET
     meescrollt. Alleen de lijst scrollt eronder door, met een zachte fade aan de bovenkant.
     'Klaar' komt pas vrij als je de hele lijst hebt doorlopen. */
  #drill{overflow:hidden}
  /* Overlaid drill title docks on scroll — same principle as the check-in swipe: the header
     lifts + shrinks into a compact top-bar title and STAYS visible while only the word list
     scrolls, so the list gets the full height. --dcic (0 rest -> 1 docked) is driven from the
     list scroll in drillInit; --ddock (travel) is set per-drill from the header height. */
  .dr-fixhead{position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;padding:2px 24px 6px;will-change:transform}
  .dr-fixhead .dr-tt-txt{transform-origin:left top;
    transform:translateY(calc(var(--dcic,0) * var(--ddock,-84px))) scale(calc(1 - var(--dcic,0) * .32));will-change:transform}
  .dr-fixhead .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--el);font-weight:700}
  .dr-fixhead h2{font-family:var(--cond);text-transform:uppercase;font-weight:800;font-size:29px;line-height:1;
    letter-spacing:-.01em;margin:7px 0 0;color:var(--ink)}
  .dr-fixhead .tveye{margin-top:12px}
  .dr-fixhead .dr-kickrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dr-fixhead .dr-kickrow .tveye{margin:0}
  .dr-fixhead .dr-sep{width:1px;height:12px;background:#CBC2B0;border-radius:1px;flex:none}
  .dr-fixhead .sub{color:var(--gray);font-size:14px;line-height:1.5;margin:10px 0 0;max-width:332px}
  #drill .sbody{position:relative;z-index:1;padding-top:2px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 44px);mask-image:linear-gradient(180deg,transparent 0,#000 44px)}
  #drill .sfoot{position:relative;z-index:3}
  #drill .nextbtn[disabled]{opacity:.5;pointer-events:none}

  /* ===== Technique vocabulary ===== */
  .tveye{display:flex;align-items:center;gap:12px;margin:16px 2px 0;
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--gray)}
  .tveye .d{width:3px;height:3px;border-radius:50%;background:#CBC2B0}
  .tvlist{margin-top:10px}
  .tvgroup{margin-top:22px}
  .tvgroup:first-child{margin-top:14px}
  .tv-glabel{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;
    color:var(--deep);margin:0 2px 4px;display:flex;align-items:center;gap:9px}
  .tv-glabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .tvrow{display:flex;align-items:center;gap:14px;padding:15px 2px}
  .tvrow + .tvrow{border-top:1px solid var(--line)}
  .tv-num{flex:none;align-self:flex-start;width:20px;margin-top:2px;font-family:var(--cond);font-weight:700;
    font-size:13px;color:#B7AE9C;text-align:right;font-variant-numeric:tabular-nums}
  .tvrow.isnew{background:var(--tint);border:1px solid var(--elline);border-radius:14px;padding:15px 16px;margin-top:6px}
  .tvrow.isnew + .tvrow{border-top:0}
  .tv-txt{flex:1;min-width:0}
  .tv-ko{font-size:19px;font-weight:700;color:var(--ink);line-height:1.2;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .tv-ro{font-size:13.5px;color:#8A8272;margin-top:3px;font-weight:600}
  .tv-nl{font-size:13.5px;color:var(--gray);margin-top:1px}
  .newtag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700;
    color:#fff;background:var(--el);border-radius:999px;padding:2px 8px}

  /* ===== Crafted practice timer ===== */
  .ptimer{position:relative;margin:10px 0 2px;border-radius:30px;overflow:hidden;color:#fff;isolation:isolate;
    min-height:min(560px,66vh);display:flex;flex-direction:column;padding:26px 24px 24px;
    box-shadow:0 30px 60px -34px rgba(20,10,4,.6)}
  .pt-bg{position:absolute;inset:0;z-index:-2;
    background:
      radial-gradient(60% 46% at 24% 16%, var(--glow), transparent 62%),
      radial-gradient(66% 60% at 84% 84%, var(--elink), transparent 60%),
      radial-gradient(50% 40% at 70% 22%, var(--hot), transparent 60%),
      linear-gradient(158deg, var(--el) 6%, var(--deep) 68%, var(--elink) 130%);
    filter:saturate(1.06)}
  .pt-noise{position:absolute;inset:0;z-index:-1;opacity:.16;mix-blend-mode:overlay;pointer-events:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.5"/></svg>')}
  .pt-cloud{position:absolute;top:22px;right:20px;width:96px;color:rgba(255,255,255,.6);z-index:0}
  .pt-cloud .cloud{width:96px}
  .pt-head{position:relative;z-index:1}
  .pt-eye{font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;font-size:11.5px;color:rgba(255,255,255,.82)}
  .pt-form{display:block;font-family:var(--cond);text-transform:uppercase;font-weight:800;font-size:24px;line-height:1;margin-top:6px}
  .pt-dial{position:relative;flex:1;display:grid;place-items:center;margin:6px 0}
  .pt-svg{width:236px;height:236px;display:block;filter:drop-shadow(0 8px 20px rgba(0,0,0,.18))}
  .pt-track{stroke:rgba(255,255,255,.22);transform:rotate(-90deg);transform-origin:120px 120px}
  .pt-prog{stroke:#fff;transform:rotate(-90deg);transform-origin:120px 120px;
    transition:stroke-dashoffset .95s linear}
  .pt-knob{fill:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
  /* Knob rides the fill: rotate the group so it stays locked to the progress edge */
  .pt-knobg{transform-box:view-box;transform-origin:120px 120px}
  .pt-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pt-time{font-family:var(--cond);font-weight:800;font-size:58px;line-height:.9;letter-spacing:.01em;
    font-variant-numeric:tabular-nums}
  .pt-sub{margin-top:8px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:11px;
    color:rgba(255,255,255,.82)}
  .pt-ctrls{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:20px}
  .pt-btn{border:0;display:grid;place-items:center;transition:transform .14s, background .2s}
  .pt-btn:active{transform:scale(.92)}
  .pt-btn.glass{width:58px;height:58px;border-radius:50%;color:#fff;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .pt-btn.glass svg{width:24px;height:24px}
  .pt-btn.main{width:78px;height:78px;border-radius:50%;background:#fff;color:var(--deep);
    box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
  .pt-btn.main svg{width:32px;height:32px;margin-left:2px}
  .pt-btn.main.playing svg{margin-left:0}

  /* ===== Teller (Koreaans tellen) — reuses the .ptimer shell ===== */
  .ptimer.teller{cursor:pointer;-webkit-user-select:none;user-select:none}
  .teller .pt-ctrls{gap:22px}
  .pt-num{font-family:var(--cond);font-weight:800;font-size:80px;line-height:.82;letter-spacing:.01em;
    font-variant-numeric:tabular-nums}
  .pt-word{margin-top:13px;display:flex;align-items:baseline;justify-content:center;gap:9px}
  .pt-word .w-ko{font-size:23px;font-weight:700;line-height:1}
  .pt-word .w-dot{opacity:.5;font-size:15px;transform:translateY(-3px)}
  .pt-word .w-ro{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:14px;
    color:rgba(255,255,255,.82)}
  .pt-hint{margin-top:16px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;font-size:11px;
    color:rgba(255,255,255,.7);transition:opacity .3s;min-height:14px}
  /* attention glint on the "tik om te starten" prompt — a bright slice sweeps through the letters,
     matching the sheen on the Vandaag "Start geleide training" CTA */
  .pt-hint.glint{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    background-image:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.96) 50%,rgba(255,255,255,0) 60%),linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7));
    background-size:230% 100%,100% 100%;background-repeat:no-repeat;background-position:96% 0,0 0;animation:hintGlint 1.2s linear}
  @keyframes hintGlint{from{background-position:96% 0,0 0}to{background-position:4% 0,0 0}}
  .pt-btn.glass.on{background:#fff;border-color:#fff;color:var(--deep)}
  /* unfolding tempo control */
  .tempo{position:relative;display:grid;place-items:center}
  .tempo .tempo-lbl{font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.01em;line-height:1}
  .pt-btn.tempo-btn{width:auto;min-width:58px;height:58px;border-radius:29px;flex-direction:row;gap:9px;padding:0 22px}
  .tempo-name{font-family:var(--cond);text-transform:uppercase;letter-spacing:.11em;font-size:12.5px;opacity:.86;line-height:1}
  .tempo-fan{position:absolute;left:50%;bottom:calc(100% + 14px);z-index:6;
    display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:22px;
    background:rgba(26,9,5,.34);border:1px solid rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    box-shadow:0 20px 46px -18px rgba(0,0,0,.7);
    opacity:0;visibility:hidden;transform:translateX(-50%) translateY(8px);transform-origin:bottom center;
    transition:opacity .18s ease, transform .18s ease, visibility .18s}
  .tempo.open .tempo-fan{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .tempo.open .tf-opt{animation:tfin .34s cubic-bezier(.34,1.4,.5,1) both}
  .tempo.open .tf-opt:nth-child(2){animation-delay:.05s}
  .tempo.open .tf-opt:nth-child(3){animation-delay:.1s}
  @keyframes tfin{from{opacity:0;transform:translateY(9px) scale(.9)}to{opacity:1;transform:none}}
  .tf-opt{border:0;background:transparent;color:#fff;cursor:pointer;border-radius:15px;
    padding:9px 16px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:82px;
    transition:background .16s, transform .12s}
  .tf-opt:active{transform:scale(.93)}
  .tf-opt b{font-family:var(--cond);font-weight:800;font-size:18px;line-height:1.15}
  .tf-opt small{font-size:10px;text-transform:uppercase;letter-spacing:.09em;opacity:.72}
  .tf-opt.on{background:rgba(255,255,255,.92);color:var(--deep)}
  .tf-opt.on small{opacity:.75}

  /* ===== Oefentimer: horizontal control bar (reset+repeat grouped left, tempo right folding left) ===== */
  .ot-fab{width:64px;height:64px;flex:none;border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);color:#fff;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 14px 30px -16px rgba(0,0,0,.55);display:grid;place-items:center;
    transition:transform .16s cubic-bezier(.34,1.4,.4,1), background .24s ease, color .24s ease, border-color .24s ease}
  .ot-fab:active{transform:scale(.9)}
  .ot-fab svg{width:26px;height:26px}
  .ot-fab.on{background:#fff;border-color:#fff;color:var(--deep)}
  /* small label above a control, revealed only in context; reset dims until there's progress to undo */
  .ot-ctl{position:relative;display:inline-flex;flex:none}
  .ot-lab{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:9px;
    font-family:var(--cond);text-transform:uppercase;font-size:10px;letter-spacing:.11em;font-weight:700;
    color:rgba(255,255,255,.72);white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.34);
    opacity:0;transition:opacity .22s ease}
  .ot-ctl.lab-on .ot-lab,.ot-tempo.open .ot-lab{opacity:1}
  .ot-fab.is-off{opacity:.32;pointer-events:none}
  .ot-bar{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:6;
    display:flex;align-items:center;justify-content:space-between}
  .ot-left{display:flex;align-items:center;gap:12px}
  .ot-tempo{position:relative;width:64px;height:64px}
  .ot-tempo-fab{position:absolute;left:0;bottom:0;z-index:1;transition:opacity .24s ease;
    background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  /* the tempo FAB paints its glass circle in ::before, so the tempo hand-off can grow ONLY the circle
     (from the 44px selection disc up to the 64px button) while the value text stays put */
  .ot-tempo-fab::before{content:'';position:absolute;inset:0;border-radius:50%;z-index:0;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 30px -16px rgba(0,0,0,.55);
    transition:transform .24s cubic-bezier(.32,.66,.4,1), background .44s ease, border-color .44s ease}
  .ot-tempo-fab .ot-tempo-cur{position:relative;z-index:1}
  .ot-tempo-cur{font-family:var(--cond);font-weight:800;font-size:17px;line-height:1;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:2px}
  .ot-tempo-cur .ot-tx,.ot-topt .ot-tx,.ot-ropt .ot-tx{font-size:.94em}
  .ot-topt .ot-tlab{display:inline-flex;align-items:center;gap:2px}
  /* Diagonal fraction (¹ ⁄ ₄) rebuilt from parts so the slash gets real breathing room left & right */
  .timerscreen .ot-fr{display:inline-block;white-space:nowrap;letter-spacing:0;font-weight:800}
  .timerscreen .ot-fr sup,.timerscreen .ot-fr sub{font-size:.72em;font-weight:800}
  .timerscreen .ot-fr .sl{font-weight:500;margin:0 .18em}
  .ot-tempo.open .ot-tempo-fab{opacity:0;pointer-events:none}
  /* Fold-out pill: same height as the button, grows RIGHTWARD from the left edge; ROUND option thumbs */
  .ot-tmenu{position:absolute;left:0;bottom:3px;height:58px;width:64px;z-index:2;overflow:hidden;
    display:flex;align-items:center;justify-content:flex-start;padding:6px;box-sizing:border-box;
    border-radius:29px;background:rgba(16,8,4,.52);border:1px solid rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 18px 44px -16px rgba(0,0,0,.72);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:width .44s cubic-bezier(.33,1.28,.4,1), opacity .22s ease, visibility .44s}
  .ot-tempo.open .ot-tmenu{opacity:1;visibility:visible;pointer-events:auto}
  .ot-tmenu-inner{position:relative;display:flex;align-items:center;gap:3px;height:44px}
  .ot-topt{position:relative;z-index:1;width:44px;height:44px;flex:none;border:0;background:transparent;
    color:rgba(255,255,255,.82);cursor:pointer;border-radius:50%;
    font-family:var(--cond);font-weight:800;font-size:20px;letter-spacing:0;
    display:grid;place-items:center;transition:color .3s ease}
  .ot-topt.on{color:var(--deep)}
  .ot-tthumb{position:absolute;top:0;left:0;height:44px;width:44px;z-index:0;border-radius:50%;
    background:#fff;box-shadow:0 5px 14px -5px rgba(0,0,0,.5);
    transition:transform .46s cubic-bezier(.34,1.35,.36,1), width .46s cubic-bezier(.34,1.35,.36,1)}
  /* On select, the whole inner (thumb + picked value) glides home while the pill collapses;
     the other options fade so only the chosen circle travels to the closed-button position. */
  .ot-tempo.collapsing .ot-topt:not(.on){opacity:0;transition:opacity .18s ease}
  /* hand-off "grow": the closed FAB is born as the white selection at the disc's 44px size,
     then grows to the 64px button. The white->glass recolour is SPLIT across the two beats:
     ~50% as the menu finishes closing (.handoff), the remaining 50% as it grows home (.settling). */
  .ot-tempo.collapsing .ot-tempo-fab::before{transform:scale(.6875);background:#fff;border-color:#fff}
  .ot-tempo.collapsing .ot-tempo-fab .ot-tempo-cur{color:var(--deep);transition:color .2s ease}
  .ot-tempo.collapsing.handoff .ot-tempo-fab::before{background:rgba(255,255,255,.739);border-color:rgba(255,255,255,.784);
    transition:background .2s ease, border-color .2s ease}
  .ot-tempo.collapsing.handoff .ot-tempo-fab .ot-tempo-cur{color:color-mix(in srgb, var(--deep), #fff 30%)}
  .ot-tempo.collapsing.settling .ot-tempo-fab::before{transform:none;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);
    transition:transform .28s cubic-bezier(.32,.72,0,1), background .28s ease, border-color .28s ease}
  .ot-tempo.collapsing.settling .ot-tempo-fab .ot-tempo-cur{color:#fff;transition:color .28s ease}

  /* ===== Oefentimer: Herhaal fold-out (mirrors the tempo fold-out) + repeats-left badge ===== */
  .ot-rep{position:relative;width:64px;height:64px}
  .ot-rep .ot-fab{position:absolute;left:0;bottom:0;z-index:1}
  .ot-rep.open{z-index:6}
  .ot-rep.open .ot-fab{opacity:0;pointer-events:none;transition:opacity .2s ease}
  .ot-rep.open .ot-lab,.ot-rep.has-sel .ot-lab{opacity:1}
  .ot-left.rep-open .ot-tempo{opacity:0;pointer-events:none;transition:opacity .2s ease}
  /* count badge — number of repeats left (finite); tucked INSIDE the disc, beneath the loop glyph.
     hidden for ∞ and when idle. only ever shown while the button is .on (white), so ink reads on white */
  .ot-badge{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-family:var(--cond);font-weight:800;font-size:14.5px;line-height:1;letter-spacing:.01em;
    color:var(--deep);pointer-events:none;z-index:2}
  .ot-badge.empty{display:none}
  .ot-badge.bump{animation:otBadgeBump .34s ease}
  @keyframes otBadgeBump{0%{transform:translateX(-50%) scale(1)}42%{transform:translateX(-50%) scale(1.34)}100%{transform:translateX(-50%) scale(1)}}
  .ot-rep-fab svg{transition:transform .26s cubic-bezier(.34,1.4,.4,1)}
  .ot-rep-fab.has-num svg{transform:translateY(-7px) scale(.9)}
  .ot-rmenu{position:absolute;left:0;bottom:3px;height:58px;width:64px;z-index:2;overflow:hidden;
    display:flex;align-items:center;justify-content:flex-start;padding:6px;box-sizing:border-box;
    border-radius:29px;background:rgba(16,8,4,.52);border:1px solid rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 18px 44px -16px rgba(0,0,0,.72);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:width .44s cubic-bezier(.33,1.28,.4,1), opacity .22s ease, visibility .44s}
  .ot-rep.open .ot-rmenu{opacity:1;visibility:visible;pointer-events:auto}
  .ot-rmenu-inner{position:relative;display:flex;align-items:center;gap:3px;height:44px}
  .ot-ropt{position:relative;z-index:1;width:44px;height:44px;flex:none;border:0;background:transparent;
    color:rgba(255,255,255,.82);cursor:pointer;border-radius:50%;
    font-family:var(--cond);font-weight:800;font-size:20px;letter-spacing:0;
    display:grid;place-items:center;transition:color .3s ease}
  .ot-ropt.inf{font-size:0}
  .ot-ropt.inf svg{width:31px;height:31px;display:block}
  .ot-ropt .ot-rlab{display:inline-flex;align-items:center;gap:1px}
  .ot-ropt.on{color:var(--deep)}
  .ot-rthumb{position:absolute;top:0;left:0;height:44px;width:44px;z-index:0;border-radius:50%;
    background:#fff;box-shadow:0 5px 14px -5px rgba(0,0,0,.5);opacity:0;
    transition:transform .46s cubic-bezier(.34,1.35,.36,1), width .46s cubic-bezier(.34,1.35,.36,1), opacity .2s ease}
  .ot-rep.has-sel .ot-rthumb{opacity:1}
  .ot-rep.open .ot-rthumb{opacity:1}                              /* thumb shows whenever the menu is open... */
  .ot-rep.open:not(.has-sel) .ot-ropt.inf{color:var(--deep)}     /* ...defaulting to ∞ when nothing is set yet */
  .ot-rep.collapsing .ot-ropt:not(.on){opacity:0;transition:opacity .18s ease}  /* select-close: fade the rest, like tempo */

  /* ===== Korean visual motifs ===== */
  .stage{
    background:
      radial-gradient(120% 80% at 50% -20%, #FBF9F3, transparent 60%),
      var(--page);
  }
  .stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="p"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="160" height="160" filter="url(%23p)" opacity="0.035"/></svg>')}
  .surface{z-index:1}

  /* Seal stamp */
  .sealmark{display:block;filter:drop-shadow(0 6px 14px rgba(140,13,23,.28))}
  .sealmark text{font-family:var(--cond),serif}

  /* Ink-wash mountains */
  .mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none}
  .mtn .mr{fill:currentColor}
  .mtn .mr3{opacity:.12}
  .mtn .mr2{opacity:.20}
  .mtn .mr1{opacity:.34}

  /* Cloud scroll divider */
  .cloud{width:120px;height:34px;color:var(--gray)}
  .clouddiv{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0 6px}
  .clouddiv .cl-t{font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:11px;
    color:var(--gray);white-space:nowrap}
  .clouddiv .cloud{width:78px}

  /* Taegeuk */
  .taegeuk{display:block}

  /* Hanok lattice texture (창살) */
  .lattice{position:relative}
  .lattice::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:.5;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%);
    background-image:

    repeat:'<svg viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="square" stroke-width="1.5" d="M8 10 4.8 7.6c-.4-.3-.4-.9 0-1.2L8 4m8 10 3.2 2.4c.4.3.4.9 0 1.2L16 20"/><path stroke="currentColor" stroke-width="1.5" d="M4.5 7H16a5 5 0 0 1 4.387 7.4M19 17H8a5 5 0 0 1-5-5c0-.84.207-1.647.574-2.353"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

  };

  /* ---- Korean visual motifs (SVG) ---- */
  // Hand-stamped seal (도장 / 낙관) — the reward mark
  function sealSVG(ch, size){
    size = size || 78;
    var uid = 's'+Math.random().toString(36).slice(2,7);
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" class="sealmark" aria-hidden="true">'+
      '<defs><filter id="'+uid+'" x="-8%" y="-8%" width="116%" height="116%">'+
        '<feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="7" result="n"/>'+
        '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter></defs>'+
      '<g filter="url(#'+uid+')">'+
        '<rect x="7" y="7" width="86" height="86" rx="14" fill="var(--seal)"/>'+
        '<rect x="14.5" y="14.5" width="71" height="71" rx="9" fill="none" stroke="#fff" stroke-width="2.4" opacity=".92"/>'+
        '<text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-family="var(--cond),serif" font-weight="800" font-size="44" fill="#fff">'+ch+'</text>'+
      '</g></svg>';
  }
  // Layered ink-wash mountain ridges (산수화) — front ridge darkest
  function mountainSVG(){
    return '<svg class="mtn" viewBox="0 0 390 130" preserveAspectRatio="none" aria-hidden="true">'+
      '<path class="mr mr3" d="M0,130 L0,58 Q54,24 104,50 Q150,74 210,40 Q286,-4 390,44 L390,130 Z"/>'+
      '<path class="mr mr2" d="M0,130 L0,84 Q70,52 148,78 Q214,100 286,72 Q340,50 390,80 L390,130 Z"/>'+
      '<path class="mr mr1" d="M0,130 L0,108 Q96,86 196,104 Q300,122 390,100 L390,130 Z"/>'+
      '</svg>';
  }
  // Auspicious cloud scroll (구름 무늬) — a single ruyi-style head
  function cloudSVG(){
    return '<svg class="cloud" viewBox="0 0 120 34" fill="none" aria-hidden="true">'+
      '<path d="M6 26 Q6 14 18 14 Q22 6 32 8 Q40 2 48 10 Q60 8 60 20 Q72 14 78 22 Q92 16 96 26" '+
        'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>'+
      '<circle cx="103" cy="24" r="2.1" fill="currentColor" opacity=".5"/></svg>';
  }
  // Taegeuk (태극) yin-yang, KTA proportions (red top, blue bottom, swirled)
  function taegeukSVG(size){
    size = size || 26;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" class="taegeuk" aria-hidden="true">'+
      '<clipPath id="tgc"><circle cx="50" cy="50" r="48"/></clipPath>'+
      '<g clip-path="url(#tgc)">'+
        '<path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z" fill="#CD2E3A"/>'+
        '<path d="M50 98 A48 48 0 0 1 50 2 A24 24 0 0 1 50 50 A24 24 0 0 0 50 98 Z" fill="#0047A0"/>'+
      '</g><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="1.5"/></svg>';
  }

  /* ---- Korean counting (native) ---- */
  var COUNT = [['하나','Hana'],['둘','Dul'],['셋','Set'],['넷','Net'],['다섯','Daseot'],
    ['여섯','Yeoseot'],['일곱','Ilgop'],['여덟','Yeodeol'],['아홉','Ahop'],['열','Yeol']];

  /* ---- Journey config (path to 1e poom) ---- */
  var JOURNEY = ['il','i','sam','sa','o','yuk','chil','pal'];
  var DONE = {il:true, i:true};
  var CUR = 'sam';           // today's focus form
  var NEXT_ID = 'sa';        // tomorrow
  var STREAK = 5;

  /* Guep/Poom stepper — Kukkiwon grades the student can pick:
     10e Wit·Il · 8e Geel·I · 6e Groen·Sam+Sa · 4e Blauw·O · 3e Blauw-Rood·Yuk ·
     2e Rood·Chil · 1e Rood-Zwart·Pal · 1e poom Koryo · 2e poom Keumgang */
  var GEUPS = [
    {stop:'10', grade:'10e geup', band:'Wit',        form:'il',                col:'#EDEDE7'},
    {stop:'8',  grade:'8e geup',  band:'Geel',       form:'i',                 col:'#FFD000'},
    {stop:'6',  grade:'6e geup',  band:'Groen',      form:'sam', form2:'sa',   col:'#16A34A'},
    {stop:'4',  grade:'4e geup',  band:'Blauw',      form:'o',                 col:'#2463E0'},
    {stop:'3',  grade:'3e geup',  band:'Blauw-Rood', form:'yuk',               col:'#2463E0', col2:'#C50116'},
    {stop:'2',  grade:'2e geup',  band:'Rood',       form:'chil',              col:'#C50116'},
    {stop:'1',  grade:'1e geup',  band:'Rood-Zwart', form:'pal',               col:'#C50116', col2:'#242327'},
    {stop:'P1', grade:'1e poom',  band:'Zwart',      form:'koryo',             col:'#242327', lines:1},
    {stop:'P2', grade:'2e poom',  band:'Zwart',      form:'keumgang',          col:'#242327', lines:2}
  ];
  var GEUP_I = 4;            // Jayden: 3e geup (blauw-rood) → trains Taegeuk Yuk Jang
  function geupInfo(k){ return GEUPS[Math.max(0,Math.min(GEUPS.length-1,k|0))]; }
  function geupForm(g){
    var f=byId(g.form); if(!f) return '';
    if(g.form2){ var f2=byId(g.form2); if(f2) return 'Taegeuk '+f.sino+' & '+f2.sino+' Jang'; }
    return f.korean;
  }
  function mascotBelt(g){
    var m={'Wit':'white','Geel':'yellow','Groen':'green','Blauw':'blue','Blauw-Rood':'blue',
           'Rood':'red','Rood-Zwart':'red','Zwart':'black'};
    return m[g && g.band] || 'blue';
  }
  // Rotating mascot: a fresh random pose on each app-open and each time you land on Vandaag
  // (stable within a visit, so toggling missions doesn't make it jump).
  var DAY_MASCOTS=['cheer','ready','guard','frontkick','sidekick','highkick'];
  function randPose(prev){
    var opts=DAY_MASCOTS.filter(function(p){ return p!==prev; });
    return opts[Math.floor(Math.random()*opts.length)];
  }
  var _mascPose = randPose(null);
  function dayMascot(){
    var slug=mascotBelt(geupInfo(GEUP_I));
    return 'assets/mascot/day/kid-'+_mascPose+'-'+slug+'.png';
  }
  // Belt colour as a CSS paint for the profile ring (dual belts → soft diagonal split).
  function beltRingCss(g){
    if(g && g.col2) return 'linear-gradient(135deg,'+g.col+' 0 42%,'+g.col2+' 58% 100%)';
    return (g && g.col) || '#E6E8EC';
  }
  function setBelt(k, commit){
    k = Math.max(0, Math.min(GEUPS.length-1, k|0));
    GEUP_I = k;
    var g = GEUPS[k];
    DONE = {};
    var fi = JOURNEY.indexOf(g.form);
    if(fi>=0){                                   // Taegeuk stop: g.form = the form you TRAIN at this grade
      for(var j=0;j<fi;j++) DONE[JOURNEY[j]] = true;    // earlier Taegeuk forms are behind you
      CUR = g.form;                                      // train this grade's own form (1e geup → Pal Jang)
      NEXT_ID = JOURNEY[fi+1] || 'koryo';                // next up (after Pal Jang comes Koryo)
    } else {                                     // poom stop: black-belt forms
      JOURNEY.forEach(function(id){ DONE[id]=true; });   // all Taegeuk forms behind you
      if(g.form==='keumgang'){ DONE['koryo']=true; CUR='keumgang'; NEXT_ID=null; }  // 2e poom → Keumgang
      else { CUR='koryo'; NEXT_ID='keumgang'; }          // 1e poom → Koryo
    }
    paintNav();
    if(commit) showScreen(state.screen);
  }
  var bpLastK = null;   // last slider index, to derive slide direction for the belt-info line
  function beltLive(k){
    var g = geupInfo(k), root = stage.querySelector('.beltpick'); if(!root) return;
    var dir = (bpLastK==null || k>=bpLastK) ? 1 : -1;   // right = up a grade, left = down
    bpLastK = k;
    var gd=root.querySelector('#bp-band'); if(gd){ gd.textContent=g.grade; bpFlash(gd,'pop'); }
    bpSwapMeta(root.querySelector('.bp-meta'), g, dir);
    beltThumb(k);
    paintGuepBand(k);
  }
  // re-trigger a CSS animation class on each step (reflow to restart); skip under reduced motion
  function bpFlash(el, cls){
    if(!el) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }
  // cross-fade the belt-info line: old text pushes aside & fades out while the new text slides in
  // & fades in — both travelling the way the slider moved (right = up a grade, left = down)
  function bpSwapMeta(meta, g, dir){
    if(!meta) return;
    var cur = meta.querySelector('.bp-meta-cur'); if(!cur) return;
    var html = '<b id="bp-grade">'+esc(g.band)+'</b> · <span id="bp-form">'+esc(geupForm(g))+'</span>';
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ cur.innerHTML=html; return; }
    var stale = meta.querySelectorAll('.bp-meta-ghost');
    for(var i=0;i<stale.length;i++){ if(stale[i].parentNode) stale[i].parentNode.removeChild(stale[i]); }
    var ghost = cur.cloneNode(true);                 // snapshot the outgoing line
    ghost.className = 'bp-meta-ghost';
    var gi=ghost.querySelector('#bp-grade'); if(gi) gi.removeAttribute('id');
    var fi=ghost.querySelector('#bp-form');  if(fi) fi.removeAttribute('id');
    meta.appendChild(ghost);
    cur.innerHTML = html;                            // new content on the live line
    cur.classList.remove('enter-r','enter-l'); void cur.offsetWidth;
    cur.classList.add(dir<0 ? 'enter-l' : 'enter-r');
    ghost.classList.add(dir<0 ? 'exit-r' : 'exit-l');
    var done=function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); };
    ghost.addEventListener('animationend', done);
    setTimeout(done, 500);
  }
  // Paint the collapse-on-scroll guep band (screen-wide colour + adaptive label)
  function paintGuepBand(k){

  /* Handboek punch-bag: slide it left↔right along the ceiling rail (a tap still lands a hit).

     bag sliding along the rail. The title block shrinks to hug the bag's left edge as it nears. */
  var PBAG={x:0, dragged:false};
  // Hook-arch outer edges at the rail line, as fractions of the mount box width (image-x 255/424
  // of 695 across the rail's image-y 121–162 band). Drive the two rails' inner edges so the gap
  // between the left/right rail segments always clears the hook, wherever the bag is dragged.
  var ARCH_L=255/695, ARCH_R=424/695;
  function updateRail(hdr){

    var span=hdr.querySelector('.whead-bag'); if(!span) return;
    var hr=hdr.getBoundingClientRect(), sr=span.getBoundingClientRect(); if(!sr.width) return;
    var l=(sr.left-hr.left)+ARCH_L*sr.width;   // left rail ends at the arch's left outer edge
    var r=(sr.left-hr.left)+ARCH_R*sr.width;   // right rail starts at the arch's right outer edge
    hdr.style.setProperty('--rail-l', Math.max(0,l).toFixed(1)+'px');

  }
  (function bagRail(){
    var span,btn,swing,hdr,jh,startX=0,startTx=0,drag=false,pid=null,minTx=0,maxTx=0,lastX=0,lastT=0,vel=0;
    function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now(); }
    function down(e){
      var b=(e.target&&e.target.closest)?e.target.closest('.pbag'):null; if(!b) return;
      btn=b; span=b.closest('.whead-bag'); hdr=b.closest('.whead-hb'); if(!span||!hdr) return;
      jh=hdr.querySelector('.jhead'); swing=b.querySelector('.pbag-swing');
      startX=e.clientX; startTx=PBAG.x; drag=false; PBAG.dragged=false; pid=e.pointerId;
      lastX=e.clientX; lastT=now();
      var hr=hdr.getBoundingClientRect(), sr=span.getBoundingClientRect();
      var half=sr.width/2, centerBase=(sr.left-PBAG.x)+half;   // untranslated hook centre
      var railR=hr.right-22-half;                              // don't overhang the rail's right end
      var leftLimit=hr.left+190+half;                          // protect the title/subtitle width
      minTx=leftLimit-centerBase; maxTx=railR-centerBase; if(minTx>maxTx) minTx=maxTx;

      if(e.cancelable) e.preventDefault();

      if(jh) jh.style.marginRight = tx<0 ? (-tx)+'px' : '';    // text right edge follows the bag
      updateRail(hdr);                                         // left/right rail ends track the hook
      var t=now(), dt=t-lastT; if(dt>0){ vel=(e.clientX-lastX)/dt; lastX=e.clientX; lastT=t; }

    }

      window.removeEventListener('pointerup', up);

            {duration:820, easing:'cubic-bezier(.2,.7,.3,1)'});

  var koVoice=null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;

    koVoice = vs.filter(function(v){return /ko(-|_)?/i.test(v.lang);})[0] || null;
  }

  /* Native-bridge seam: a future iOS/Capacitor shell can define
       window.PoomNative = { speak(text,lang,rate), haptic(ms) }
     before the page loads. On the web PoomNative is undefined, so every path below is
     unchanged. Keeping all pronunciation routed through speak() and all haptics through
     buzz() means the native port only implements that one object — no code archaeology. */
  function speak(txt, btn){
    var N=window.PoomNative;
    if(N && typeof N.speak==='function'){
      if(btn){ btn.classList.add('ring'); setTimeout(function(){ btn.classList.remove('ring'); }, Math.max(700, String(txt).length*140)); }
      try{ N.speak(txt, 'ko-KR', 0.9); }catch(e){}
      return;
    }
    if(!('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(txt);
      if(koVoice){ u.voice=koVoice; u.lang=koVoice.lang; } else { u.lang='ko-KR'; }
      u.rate=.9;
      if(btn){ btn.classList.add('ring'); u.onend=u.onerror=function(){btn.classList.remove('ring');}; }
      speechSynthesis.speak(u);
    }catch(e){}
  }

      var th=Math.max(28, Math.round(ch*ch/sh)), travel=ch-th;

      t.style.height=th+'px';
      t.style.transform='translateY('+(c.scrollTop+y)+'px)';
      t.classList.add('on');
      clearTimeout(c._vsbHide);
      c._vsbHide=setTimeout(function(){ if(c._vsb) c._vsb.classList.remove('on'); }, 950);
    }
    document.addEventListener('scroll', function(e){
      var c=e.target;
      if(c && c.nodeType===1 && c.matches && c.matches(SEL)) update(c);
    }, true);

  // lighten(+)/darken(-) a #rrggbb hex by pct toward white/black
  function shade(hex, pct){
    var h=hex.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    var t=pct<0?0:255, p=Math.abs(pct)/100;
    function mix(c){ return Math.round((t-c)*p+c); }
    function hx(c){ return ('0'+c.toString(16)).slice(-2); }
    return '#'+hx(mix(r))+hx(mix(g))+hx(mix(b));
  }

  // 'Klaar' pas vrij als je de hele lijst hebt doorlopen (of als de lijst niet scrollbaar is, bv. korte spar-drill).
  // Daarnaast: de overlay-titel dokt mee met de scroll (zelfde principe als de check-in swipe).
  function drillInit(){
    if(!drillEl) return;
    WDECK=null;
    var body=drillEl.querySelector('#drill-body'), doneBtn=drillEl.querySelector('#drill-done'),
        head=drillEl.querySelector('#drill-head'), shead=drillEl.querySelector('.shead'),
        inEl=body&&body.querySelector('.dr-in');
    if(!body) return;
    // Dok-geometrie: de titel overlapt de lijst; de lijst begint er in rust onder en scrollt eronder door.
    var sH = shead ? shead.offsetHeight : 0;
    if(head) head.style.top = sH+'px';
    var hH = head ? head.offsetHeight : 0;
    if(inEl) inEl.style.paddingTop = (hH + 12)+'px';
    var dock = Math.max(56, Math.round(hH*0.5));    // afstand die de titel omhoog dokt
    if(head) head.style.setProperty('--ddock', (-dock)+'px');
    drillEl.style.setProperty('--dcic','0');
    function dockUpd(){ var c=body.scrollTop/dock; c=c<0?0:c>1?1:c; drillEl.style.setProperty('--dcic', c.toFixed(3)); }
    if(body._drDock) body.removeEventListener('scroll', body._drDock);
    body._drDock=dockUpd; body.addEventListener('scroll', dockUpd, {passive:true}); dockUpd();
    function gate(){
      if(!doneBtn || !doneBtn.disabled) return;
      // In kaarten-modus regelt de deck zelf de vrijgave (wdUnlock op de laatste kaart);
      // de korte, niet-scrollbare kaartweergave mag 'Klaar' niet per ongeluk vrijgeven.
      if(WDECK){ var _lv=body.querySelector('.wd-lijst'); if(_lv && !_lv.classList.contains('on')) return; }
      if(body.scrollTop+body.clientHeight >= body.scrollHeight-6){
        doneBtn.disabled=false; doneBtn.removeAttribute('aria-disabled'); doneBtn.classList.remove('ghost');
      }
    }
    if(body._drScroll) body.removeEventListener('scroll', body._drScroll);
    body._drScroll=gate;
    body.addEventListener('scroll', gate, {passive:true});
    if(drillId==='woorden') wdSetup(body, doneBtn);   // deck opzetten vóór de eerste gate: zet WDECK zodat de kaarten-guard grijpt
    gate();
  }

  // Woorden-deck (Kaarten-tab): bladerbare flip-kaarten naast de lijst.
  function wdSetup(body, doneBtn){
    var root = body && body.querySelector('.wd-kaarten'); if(!root){ WDECK=null; return; }
    WDECK = { root:root, terms:(vocabOfDay().terms||[]), idx:0, done:doneBtn, swiped:false };
    var taps = root.querySelectorAll('.tap');
    for(var ti=0; ti<taps.length; ti++){ var tp=taps[ti];
      if(!tp._wdGlint){ tp._wdGlint=true; tp.addEventListener('animationend', function(){ this.classList.remove('glint'); }); }
    }
    // listen-pill nudge cleanup (deck back)
    var lb = root.querySelector('.wf-listen');
    if(lb && !lb._wdNudge){ lb._wdNudge=true; lb.addEventListener('animationend', function(){ this.classList.remove('nudge'); }); }
    var deck = root.querySelector('.wdeck');
    var card = root.querySelector('#wd-flip');
    if(deck && card && !card._wdSwipe){
      card._wdSwipe=true; card.style.touchAction='pan-y'; deck.style.touchAction='pan-y';
      var sx=0, sy=0, dn=false, drag=false, W=300, pid=null;
      var springIn='transform .26s cubic-bezier(.32,.72,0,1),opacity .26s ease';
      function relax(anim){ card.style.transition = anim ? springIn : 'none'; card.style.transform=''; card.style.opacity=''; }
      function atStart(){ return WDECK && WDECK.idx===0; }
      function atLast(){ return WDECK && WDECK.idx===WDECK.terms.length-1; }
      deck.addEventListener('pointerdown', function(e){
        if(e.target.closest && e.target.closest('.wf-listen,.wdeck-dots')){ dn=false; return; }
        dn=true; drag=false; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
        W=card.offsetWidth||300; if(WDECK) WDECK.swiped=false; card.style.transition='none';
      });
      deck.addEventListener('pointermove', function(e){
        if(!dn) return;
        var dx=e.clientX-sx, dy=e.clientY-sy;
        if(!drag){
          if(Math.abs(dx)<8) return;
          if(Math.abs(dx)<=Math.abs(dy)){ dn=false; return; }   // vertical intent → let it scroll
          drag=true; try{ deck.setPointerCapture(pid); }catch(_){}
        }
        var atEnd=(dx>0&&atStart())||(dx<0&&atLast());
        var eff=atEnd?dx*0.3:dx;                                 // rubber-band resistance at the ends
        card.style.transform='translateX('+eff+'px) rotate('+(eff*0.018)+'deg)';
        card.style.opacity=String(Math.max(.5,1-Math.abs(eff)/(W*1.5)));
      });
      function end(e){
        if(!dn) return; dn=false;
        try{ if(pid!=null) deck.releasePointerCapture(pid); }catch(_){}
        if(!drag){ relax(false); return; }                      // pure tap → leave the flip-click alone
        if(WDECK) WDECK.swiped=true;                             // any real drag suppresses the ensuing flip
        var dx=(e.clientX||sx)-sx;
        var go = Math.abs(dx)>Math.min(72,W*0.22) && !((dx>0&&atStart())||(dx<0&&atLast()));
        if(go && WDECK){
          var dir = dx<0 ? 1 : -1;                               // left-swipe → next, right-swipe → prev
          card.style.transition='transform .17s ease,opacity .17s ease';
          card.style.transform='translateX('+(dir<0?W:-W)+'px)'; card.style.opacity='0';
          setTimeout(function(){
            wdShow(WDECK.idx+dir);
            card.style.transition='none';
            card.style.transform='translateX('+(dir<0?-W:W)+'px)'; card.style.opacity='0';
            void card.offsetWidth;                              // start off-screen on the opposite side, then glide in

  var examEl = null, examState = null;
  function examBank(){
    var src = (window.POOM_VRAGEN && window.POOM_VRAGEN.vragen) || [];
    var out = [];
    src.forEach(function(q){
      if(q.niveau==='poom2' && POOM!=='2') return;        // Koryo-theorie pas vanaf 2e poom
      var opts = (q.opties||[]).slice();
      var ai = opts.indexOf(q.antwoord);
      if(opts.length<2 || ai<0){                          // ongeldige vraag → melden + overslaan
        if(window.console) console.warn('[examen] vraag overgeslagen (antwoord niet in opties):', q.id); return; }
      out.push({ v:q.vraag, o:opts, a:ai, cat:q.categorie||'', why:q.toelichting||'', term:q.term||'' });
    });
    return out;
  }
  function examShuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function openExam(){
    if(examEl) return;
    var rule = examRule();
    var bank = examBank();
    if(!bank.length){ return; }
    var n = Math.min(rule.total, bank.length);
    // Prioritise questions tied to a bookmarked (moeilijk) term so the proefexamen tests what the
    // student marked as hard — then fill the rest and shuffle the final set for a natural order.
    var sh = examShuffle(bank);
    var hot = sh.filter(function(q){ return q.term && HARD[q.term]; });
    var rest = sh.filter(function(q){ return !(q.term && HARD[q.term]); });
    var qs = examShuffle(hot.concat(rest).slice(0, n));
    examState = { qs:qs, i:0, goed:0, fout:0, total:n, maxFout:rule.fout, pass:Math.max(1, n-rule.fout), answered:false };
    var el = document.createElement('div');
    el.className='session exam'; el.id='exam';
    applyTheme(el, CUR);
    el.innerHTML =
      '<div class="shead">'+
        '<button class="sx" data-act="exclose" aria-label="Sluiten">'+IC.x+'</button>'+
      '</div>'+
      '<div class="sbody" id="ex-body"></div>'+
      '<div class="sfoot" id="ex-foot"></div>';

    if(sub){ sub.textContent = ptState.running
      ? (ptState.t>=ptState.target ? 'mooi tempo — houd vol! 🔥' : 'loop de vorm rustig door')
      : (ptState.t>0 ? 'gepauzeerd' : 'tik op start'); }

        answered:function(){ return !!rfMood; },
        summary:function(){ var m=moodInfo(rfMood); return m?m.em+' '+m.t:''; } },
      { id:'focus', q:'Waar wil je op letten?', hint:'Kies er 1 tot 5 om deze week centraal te zetten.',
        opts:function(){ var full=rfPick.length>=FOCUS_MAX; return '<div class="fchips">'+FOCUS_AREAS.map(function(fa){
            var on=rfPick.indexOf(fa.id)>=0, dis=full&&!on;
            return '<button class="fchip'+(on?' on':'')+(dis?' disabled':'')+'"'+(dis?' disabled':'')+' data-act="pickfocus" data-id="'+fa.id+'">'+
              '<span class="fe">'+fa.em+'</span><span>'+fa.label+'</span><span class="fck">'+IC.check+'</span></button>';
          }).join('')+'</div>'; },
        answered:function(){ return rfPick.length>0; },
        summary:function(){ return rfPick.length?focusShortFrom(rfPick):''; } }
    ];
    return [
      { id:'went', q:'Hoe ging je training deze week?', hint:'Eerlijk zijn helpt je coach.',
        opts:function(){ return '<div class="rate">'+WENT_OPTS.map(function(o){ return ciOpt(o, rfRating===o.r, 'pickwent'); }).join('')+'</div>'; },
        answered:function(){ return !!rfRating; },
        summary:function(){ var o=optInfo(WENT_OPTS,rfRating); return o?o.em+' '+o.t:''; } },
      { id:'helpful', q:'Hielpen de voorgestelde trainingen?', hint:'Zo weet je coach wat werkt.',
        opts:function(){ return '<div class="rate">'+HELP_OPTS.map(function(o){ return ciOpt(o, rfHelp===o.r, 'pickhelp'); }).join('')+'</div>'; },
        answered:function(){ return !!rfHelp; },
        summary:function(){ var o=optInfo(HELP_OPTS,rfHelp); return o?o.em+' '+o.t:''; } }
    ];
  }
  function ciMeta(){
    return rfMode==='goal'
      ? { icon:'doel', k:'DOELSTELLING · WK '+weekNo(), h:'Zet je doel voor deze week', sub:'Twee snelle keuzes — daarna kun je los.' }
      : { icon:'reflectie', k:'REFLECTIE · WK '+weekNo(), h:'Hoe was jouw week?', sub:'Eerlijk zijn helpt je coach je beter te helpen.' };
  }
  function ciSwitcherInner(){
    var modes=[['page','Pagina'],['accordion','Accordeon'],['swipe','Kaarten']];
    return modes.map(function(m){ return '<button class="uxb'+(CI_UX===m[0]?' on':'')+'" data-act="setux" data-ux="'+m[0]+'">'+m[1]+'</button>'; }).join('');
  }
  function openCheckin(mode){
    rfMode = (mode==='goal'||mode==='reflect') ? mode : weekPhase();
    rfRating = WEEK_RATING; rfPick = WEEK_FOCUS.slice(); rfMood = WEEK_MOOD; rfHelp = WEEK_HELP;
    reflect = document.createElement('div');
    reflect.className='session reflect onepage'; reflect.id='reflect';
    applyTheme(reflect, CUR);
    reflect.innerHTML =
      '<div class="shead">'+
        '<button class="sx" data-act="rclose" aria-label="Sluiten">'+IC.x+'</button>'+
      '</div>'+
      '<div class="sbody" id="rfbody"></div>'+
      '<div class="sfoot" id="rffoot"></div>';
    stage.appendChild(reflect);
    fnav.classList.add('hide');
    requestAnimationFrame(function(){ reflect.classList.add('show'); });
    renderCheckin();
  }
  function closeCheckin(){
    if(!reflect) return;
    ciStopBlink();
    reflect.classList.remove('show');
    var r=reflect; reflect=null;
    setTimeout(function(){ if(r&&r.parentNode) r.parentNode.removeChild(r); }, 300);
    fnav.classList.remove('hide');
  }
  function ciSave(){
    if(rfMode==='goal'){ WEEK_FOCUS = rfPick.slice(); WEEK_MOOD = rfMood; weekGoalSet = true; }
    else { WEEK_RATING = rfRating; WEEK_HELP = rfHelp; weekReflected = true; }
  }
  function ciValid(){
    return rfMode==='goal' ? !!(rfMood && rfPick.length) : !!(rfRating && rfHelp);
  }
  // Submit saves every answer at once and drops straight back to Vandaag.
  function ciSubmit(){
    if(!reflect || !ciValid()) return;
    ciSave(); closeCheckin(); showScreen('today');
  }
  function syncSubmit(){
    if(!reflect) return;
    var foot=reflect.querySelector('#rffoot'); if(!foot) return;
    foot.innerHTML = ciValid()
      ? '<button class="nextbtn" data-act="cisubmit">'+(rfMode==='goal'?'Doel opslaan':'Opslaan')+' '+IC.check+'</button>'
      : '<button class="nextbtn ghost" disabled style="opacity:.45">'+(rfMode==='goal'?'Kies je gevoel én focus':'Beantwoord beide vragen')+'</button>';
  }
  function ciTitle(icon,k,h,sub){
    return '<div class="cihead"><span class="ci-badge '+icon+'" aria-hidden="true"></span>'+
      '<div class="k">'+k+'</div><h2>'+h+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>';
  }
  function ciQ(q,hint,inner){
    return '<section class="qblock"><h3 class="qh">'+q+'</h3>'+(hint?'<p class="qhint">'+hint+'</p>':'')+inner+'</section>';
  }
  /* ===== variant A: single page (all questions stacked) ===== */
  function renderPage(){
    var qs=ciQuestions();
    return '<div class="stepin">'+
      qs.map(function(x){ return ciQ(x.q,x.hint,x.opts()); }).join('')+'</div>';
  }

  /* ===== variant B: accordion (one question open at a time; tap a row to reopen it) ===== */
  function renderAccordion(){
    var qs=ciQuestions();
    return '<div class="stepin">'+
      '<div class="acclist">'+qs.map(function(x,i){
        return '<div class="acc" data-q="'+x.id+'">'+
          '<button class="acc-h" data-act="acctoggle" data-q="'+x.id+'">'+
            '<span class="acc-n">'+(i+1)+'</span>'+
            '<span class="acc-qt"><span class="acc-q">'+x.q+'</span>'+
              '<span class="acc-a">'+(x.answered()?esc(x.summary()):'Tik om te kiezen')+'</span></span>'+
            '<span class="acc-chev">'+IC.chev+'</span>'+
          '</button>'+
          '<div class="acc-b"><div class="acc-bin">'+x.opts()+'</div></div>'+
        '</div>';
      }).join('')+'</div></div>';
  }
  function accEl(qid){ return reflect?reflect.querySelector('.acc[data-q="'+qid+'"]'):null; }
  function accResize(qid){ var el=accEl(qid); if(!el||!el.classList.contains('open'))return; var b=el.querySelector('.acc-b'); b.style.maxHeight=b.scrollHeight+'px'; }
  function accOpen(qid){
    if(!reflect) return;
    [].forEach.call(reflect.querySelectorAll('.acc'), function(el){
      var open=el.getAttribute('data-q')===qid;
      el.classList.toggle('open',open);
      var b=el.querySelector('.acc-b');
      b.style.maxHeight = open ? b.scrollHeight+'px' : '0px';
    });
  }
  function accOpenNone(){ if(!reflect) return; [].forEach.call(reflect.querySelectorAll('.acc'), function(el){ el.classList.remove('open'); el.querySelector('.acc-b').style.maxHeight='0px'; }); }
  function accInit(){
    var qs=ciQuestions(), openId=null;
    for(var i=0;i<qs.length;i++){ if(!qs[i].answered()){ openId=qs[i].id; break; } }
    if(openId) accOpen(openId); else accOpenNone();
  }
  function accSummary(qid){
    var el=accEl(qid); if(!el) return;
    var qs=ciQuestions(), x=null; qs.forEach(function(q){ if(q.id===qid) x=q; });
    if(!x) return;
    var a=el.querySelector('.acc-a'); if(a) a.textContent = x.answered()?x.summary():'Tik om te kiezen';
    el.classList.toggle('done', x.answered());
  }
  function accToggle(qid){ var el=accEl(qid); if(!el)return; if(el.classList.contains('open')) accOpenNone(); else accOpen(qid); }
  function accAdvance(qid){
    accSummary(qid);
    var qs=ciQuestions(), idx=-1, i, nextId=null;
    for(i=0;i<qs.length;i++) if(qs[i].id===qid) idx=i;
    for(i=idx+1;i<qs.length;i++){ if(!qs[i].answered()){ nextId=qs[i].id; break; } }
    if(!nextId) for(i=0;i<qs.length;i++){ if(!qs[i].answered()){ nextId=qs[i].id; break; } }
    if(nextId) accOpen(nextId); else accOpenNone();
  }

  /* ===== variant C: vertical swipe cards (scroll-snap; auto-advances on answer) ===== */
  function renderSwipe(){
    var qs=ciQuestions(), n=qs.length;
    return qs.map(function(x,i){
      return '<section class="qcard" data-q="'+x.id+'"><div class="qcard-in">'+
        '<span class="qc-count">Vraag '+(i+1)+' / '+n+'</span>'+
        '<h2 class="qc-q">'+x.q+'</h2>'+(x.hint?'<p class="qc-sub">'+x.hint+'</p>':'')+
        '<div class="qc-opts">'+x.opts()+'</div>'+
      '</div>'+
      '</section>';
    }).join('');
  }
  function swipeInit(){
    /* Overlaid title collapses as you scroll toward the next card: drives --cic (0 -> 1) from the
       scroll position so the title lifts/shrinks/fades and each question card gets the full height.
       Forward is gated (swipeSyncLocks): the next card stays hidden until this one is answered, so
       there's no "swipe up" guidance to show — answering auto-advances. Swiping back is always free. */
    if(CI_UX!=='swipe' || !reflect) return;
    var body=reflect.querySelector('#rfbody'), ttl=reflect.querySelector('.ci-topttl'),
        shead=reflect.querySelector('.shead');
    if(!body || !ttl) return;
    if(shead) ttl.style.top=shead.offsetHeight+'px';
    reflect.style.setProperty('--cic','0');
    // Title docks 1:1 with the scroll (denom matches the title's -150px translate) so a rising
    // card can't sneak under it; past 150px it's parked as the compact header in the top bar.
    var denom=150;
    function upd(){
      if(!reflect) return;
      var c=body.scrollTop/denom; c=c<0?0:c>1?1:c;
      reflect.style.setProperty('--cic', c.toFixed(3));
    }
    if(body._ciScroll) body.removeEventListener('scroll', body._ciScroll);
    body._ciScroll=upd;
    body.addEventListener('scroll', upd, {passive:true});
    upd();
    swipeSyncLocks();
  }
  // Progressive gating: a question card is reachable only once every EARLIER question is answered.
  // Locked cards are display:none, so scroll-snap can't reach them (the user must answer Q1 before
  // Q2). Earlier cards stay visible, so swiping back to a previous question always works.
  function swipeSyncLocks(){
    if(CI_UX!=='swipe' || !reflect) return;
    var body=reflect.querySelector('#rfbody'); if(!body) return;
    var qs=ciQuestions(), cards=[].slice.call(body.querySelectorAll('.qcard')), locked=false;
    for(var i=0;i<cards.length;i++){
      cards[i].classList.toggle('locked', locked);
      if(!qs[i] || !qs[i].answered()) locked=true; // everything past the first unanswered question is locked
    }
  }
  function swipeAdvance(qid){
    if(!reflect) return;
    var body=reflect.querySelector('#rfbody'); if(!body) return;
    var cards=[].slice.call(body.querySelectorAll('.qcard'));
    for(var i=0;i<cards.length;i++){
      if(cards[i].getAttribute('data-q')===qid){
        var next=cards[i+1]; if(!next) break;
        setTimeout(function(c){ return function(){
          // centre the next card (matches scroll-snap-align:center) with a slow, manual-like glide
          var br=body.getBoundingClientRect(), cr=c.getBoundingClientRect();
          var target=body.scrollTop + (cr.top+cr.height/2) - (br.top+body.clientHeight/2);
          rfGlide(body, Math.max(0, Math.round(target)), 820);
        }; }(next), 180);
        break;
      }
    }
  }
  // Slow, eased scroll for the check-in swipe flow. Native smooth-scroll is fixed and snappy, so
  // this rAF tween stretches the duration and softens the easing to feel like a gentle manual
  // scroll. Snap + CSS smooth-scroll are disabled during the tween so they don't fight it, then
  // restored — we land exactly on the card's centre snap point, so re-enabling snap won't jump.
  function rfGlide(body, target, dur){
    if(!body) return;
    if(body._rfRAF){ cancelAnimationFrame(body._rfRAF); if(body._rfDone) body._rfDone(); }
    var start=body.scrollTop, dist=target-start;
    var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || Math.abs(dist)<2){ var pb0=body.style.scrollBehavior; body.style.scrollBehavior='auto'; body.scrollTop=target; body.style.scrollBehavior=pb0; return; }
    var prevBeh=body.style.scrollBehavior, prevSnap=body.style.scrollSnapType, done=false;
    body.style.scrollBehavior='auto'; body.style.scrollSnapType='none';
    function finish(){
      if(done) return; done=true;
      body.style.scrollBehavior=prevBeh; body.style.scrollSnapType=prevSnap;
      body.removeEventListener('touchstart',onGrab); body.removeEventListener('wheel',onGrab);
      body._rfRAF=0; body._rfDone=null;
    }
    body._rfDone=finish;
    function onGrab(){ if(body._rfRAF) cancelAnimationFrame(body._rfRAF); finish(); } // user takes over → hand back to native snap
    body.addEventListener('touchstart',onGrab,{passive:true});
    body.addEventListener('wheel',onGrab,{passive:true});
    function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; } // easeInOutCubic
    var t0=0;
    function frame(ts){
      if(!t0) t0=ts;
      var p=(ts-t0)/dur; if(p>1) p=1;
      body.scrollTop=start+dist*ease(p);
      if(p<1){ body._rfRAF=requestAnimationFrame(frame); }
      else { body.scrollTop=target; finish(); }
    }
    body._rfRAF=requestAnimationFrame(frame);
  }

  // shared post-pick behaviour across the three layouts
  function ciAfterPick(qid, el){
    if(el) ciSel(el);
    if(CI_UX==='accordion') accAdvance(qid);
    else if(CI_UX==='swipe'){ swipeSyncLocks(); swipeAdvance(qid); }
    syncSubmit();
  }
  function ciAfterFocus(){
    syncFocusChips();
    if(CI_UX==='accordion') accResize('focus');
    else if(CI_UX==='swipe') swipeSyncLocks();
    syncSubmit();
  }
  // corner belt graphic recolours to the current grade (solid primary; poom stays black)
  function ciPaintBelt(node){
    var g=geupInfo(GEUP_I);
    node.style.setProperty('--belt-main', g.col);
    node.style.setProperty('--belt-dark', shade(g.col,-38));
  }
  function renderCheckin(){
    if(!reflect) return;
    var m=ciMeta();
    reflect.classList.remove('ux-page','ux-accordion','ux-swipe'); reflect.classList.add('ux-'+CI_UX);
    ['.swipedots','.uxswitch','.ci-topttl','.ci-topmasc','.ci-beltband'].forEach(function(sel){ var e=reflect.querySelector(sel); if(e) e.parentNode.removeChild(e); });
    var bodyEl=reflect.querySelector('#rfbody'), footEl=reflect.querySelector('#rffoot');
    // greeting-style title at the top (like Vandaag); goal shows the cheering kid, reflect the coiled belt
    var mascHtml = rfMode==='goal'
      ? '<span class="ci-tt-masc"><span class="gm-b">'+
          '<img class="gm-i" src="assets/img/goal-kid.png" alt="" aria-hidden="true">'+
          '<img class="gm-i gm-blink" src="assets/img/goal-kid-blink.png" alt="" aria-hidden="true">'+
        '</span></span>'
      : '<span class="ci-tt-belt" aria-hidden="true"><span class="bb-belt">'+
          '<span class="cb cb-main"></span><span class="cb cb-dark"></span><span class="cb cb-ink"></span>'+
        '</span></span>';
    var ttl=document.createElement('div'); ttl.className='ci-topttl'+(rfMode==='goal'?' has-masc':' has-belt');
    // In swipe the mascot/belt lives in its OWN layer behind the cards so cards scroll over it; the title stays on top.
    ttl.innerHTML='<div class="ci-tt-txt"><div class="k">'+m.k+'</div><h2>'+m.h+'</h2></div>'+(CI_UX==='swipe'?'':mascHtml);
    reflect.insertBefore(ttl, bodyEl);
    if(CI_UX==='swipe'){ var mL=document.createElement('div'); mL.className='ci-topmasc'+(rfMode==='goal'?' has-masc':' has-belt'); mL.innerHTML=mascHtml; reflect.insertBefore(mL, bodyEl); }
    if(_ciCompare){ var d=document.createElement('div'); d.className='uxswitch'; d.innerHTML=ciSwitcherInner(); reflect.insertBefore(d, bodyEl); }
    bodyEl.innerHTML = CI_UX==='accordion' ? renderAccordion() : CI_UX==='swipe' ? renderSwipe() : renderPage();
    bodyEl.scrollTop=0;
    // reflect: the coiled belt recolours to the current grade (belt lives in ttl for page/accordion, in the mascot layer for swipe)
    if(rfMode!=='goal'){ var bb=reflect.querySelector('.bb-belt'); if(bb) ciPaintBelt(bb); }
    if(CI_UX==='accordion') requestAnimationFrame(accInit);
    if(CI_UX==='swipe') requestAnimationFrame(swipeInit);
    if(rfMode==='goal') ciScheduleBlink(); else ciStopBlink();
    syncSubmit();
  }

  /* ---- boot ---- */
  function boot(){ setBelt(GEUP_I, false); renderToday(); scheduleBlink();
    requestAnimationFrame(moveNavHL); setTimeout(moveNavHL, 320); }
  if(poomsae.length){ boot(); }
  else {
    // data not ready yet (shouldn't happen — script loaded before)
    var tries=0, iv=setInterval(function(){
      C=window.CURRICULUM||{}; poomsae=C.poomsae||[];
      if(poomsae.length||++tries>20){ clearInterval(iv); if(poomsae.length) boot(); }
    },80);
  }
})();
</script>
<script>
  /* Offline-first: registreer dezelfde service worker als de hoofd-app.
     Zo blijft de coach werken zonder server (op je startscherm/https). */
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadController || reloaded) return;
      reloaded = true; window.location.reload();
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function(e){ console.warn('SW mislukt', e); });
    });
  }
</script>
</body>
