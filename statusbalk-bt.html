<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statusbalk-test (black-translucent)</title>
<link rel="manifest" href="statusbalk-bt.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balk BT">
<style>
  html{overflow:hidden}
  body{margin:0;background:#F4F1EA;color:#151A21;position:fixed;inset:0;overflow-y:auto;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  /* De strook onder de klok tekenen we zelf: dat kan alleen als de inhoud eronder doorloopt. */
  .strook{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#F4F1EA;z-index:9;
    transition:background .3s}
  .vul{padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 32px)}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:#5A6472;font-size:14px}
  .meting{background:#fff;border:1px solid #E2DDD1;border-radius:14px;padding:12px 14px;margin-bottom:18px;
    font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  button{display:block;width:100%;margin:0 0 10px;padding:14px 16px;border:0;border-radius:14px;
    background:#2468D6;color:#fff;font-size:15px;font-weight:600;text-align:left;-webkit-appearance:none}
  button.licht{background:#F4F1EA;color:#151A21;border:1px solid #E2DDD1}
  .stap{font-size:13px;color:#5A6472;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>
<div class="strook" id="strook"></div>
<div class="vul">
  <h1>Statusbalk-test — <code>black-translucent</code></h1>
  <p class="sub">Zet ook deze pagina apart op je beginscherm en open hem daarvandaan. Hier loopt de inhoud onder de klok door en tekenen we de strook zelf.</p>

  <div class="meting" id="meting">…</div>

  <div class="stap">Kleur de strook</div>
  <button class="licht" data-c="#F4F1EA">crème — is de klok leesbaar?</button>
  <button data-c="#2468D6">blauw — is de klok leesbaar?</button>
  <button data-c="#1E8C5A" style="background:#1E8C5A">groen</button>
  <button data-c="#151A21" style="background:#151A21">bijna zwart</button>
</div>
<script>
  function meet(){
    var s = document.getElementById('strook');
    document.getElementById('meting').textContent =
      'standalone: ' + (window.navigator.standalone ? 'ja (beginscherm)' : 'nee (Safari-tab)') +
      '\nsafe-area-inset-top: ' + getComputedStyle(s).height +
      '\nstrookkleur: ' + getComputedStyle(s).backgroundColor;
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.getElementById('strook').style.background = b.getAttribute('data-c');
    setTimeout(meet, 350);
  });
  meet();
</script>
</body>
</html>
